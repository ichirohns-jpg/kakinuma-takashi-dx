<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d66d29">
  <meta name="description" content="柿沼貴志議員の活動報告">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=20260731">

  <title>活動報告 | 柿沼貴志DX</title>

  <style>
    :root{
      --p:#d66d29;
      --d:#743714;
      --s:#fff5eb;
      --a:#f0b477;
      --t:#2d2722;
      --l:#ead5c4;
    }

    body{
      background:linear-gradient(180deg,var(--s),#fff 55%);
    }

    .article-page{
      padding-bottom:50px;
    }

    .article-header{
      margin:0 12px 18px;
      padding:20px 18px;
      border:2px solid var(--a);
      border-radius:20px;
      background:linear-gradient(135deg,#fff,var(--s));
    }

    .article-kicker{
      margin:0 0 6px;
      color:var(--p);
      font-size:15px;
      font-weight:900;
    }

    .article-title{
      margin:0;
      color:var(--d);
      font-size:clamp(27px,8vw,38px);
      line-height:1.45;
    }

    .article-date{
      margin:10px 0 0;
      color:#806f64;
      font-size:15px;
      font-weight:800;
    }

    .article-body{
      white-space:pre-wrap;
      font-size:19px;
      line-height:2.15;
    }

    .article-gallery{
      display:flex;
      gap:14px;
      overflow-x:auto;
      padding:4px 2px 14px;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior-x:contain;
      scroll-snap-type:x mandatory;
      scrollbar-width:thin;
    }

    .article-gallery img{
      width:260px;
      height:230px;
      flex:0 0 260px;
      object-fit:cover;
      border-radius:15px;
      scroll-snap-align:start;
    }

    .video-title{
      margin:24px 0 12px;
      color:var(--d);
      font-size:22px;
    }

    .article-video{
      position:relative;
      aspect-ratio:16/9;
      overflow:hidden;
      border-radius:14px;
      background:#382219;
    }

    .article-video iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
    }

    .share-title{
      margin:0 0 12px;
      color:var(--d);
      font-size:22px;
    }

    .share-buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .share-button{
      display:block;
      padding:13px 8px;
      border:0;
      border-radius:12px;
      background:var(--p);
      color:#fff;
      font:inherit;
      font-weight:900;
      text-align:center;
      text-decoration:none;
    }

    .share-button.x{
      background:#111;
    }

    .share-button.line{
      background:#06c755;
    }

    .share-button.copy{
      background:#80624d;
      cursor:pointer;
    }

    .article-message{
      margin:16px 14px;
      padding:18px;
      border-radius:15px;
      background:#fff0ed;
      color:#9d3827;
      font-size:17px;
      line-height:1.8;
    }

    .back-buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin:18px 14px;
    }

    .back-buttons a{
      display:block;
      padding:14px 8px;
      border-radius:12px;
      background:#f3e4d7;
      color:var(--d);
      font-weight:900;
      text-align:center;
      text-decoration:none;
    }

    @media(max-width:560px){
      .article-body{
        font-size:18px;
      }

      .article-gallery img{
        width:235px;
        height:215px;
        flex-basis:235px;
      }

      .share-buttons{
        grid-template-columns:1fr;
      }

      .back-buttons{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="mark">DX</div>
    <div class="brand">柿沼貴志 活動報告</div>
  </header>

  <main class="article-page">
    <div id="loadingMessage" class="article-message">
      活動報告を読み込んでいます。
    </div>

    <article id="articleArea" class="hidden">
      <header class="article-header">
        <p class="article-kicker">柿沼貴志議員 活動報告</p>
        <h1 id="articleTitle" class="article-title"></h1>
        <p id="articleDate" class="article-date"></p>
      </header>

      <section class="card">
        <div id="articleBody" class="article-body"></div>
      </section>

      <section id="photoSection" class="card hidden">
        <h2>活動報告の写真</h2>
        <p class="photo-note">
          写真は左右にスワイプしてご覧いただけます。
        </p>
        <div id="articleGallery" class="article-gallery"></div>
      </section>

      <section id="videoSection" class="card hidden">
        <h2 class="video-title">活動報告の動画</h2>
        <div id="articleVideo" class="article-video"></div>
      </section>

      <section class="card">
        <h2 class="share-title">この記事を共有</h2>

        <div class="share-buttons">
          <a id="facebookButton" class="share-button" href="#" target="_blank" rel="noopener">
            Facebook
          </a>

          <a id="xButton" class="share-button x" href="#" target="_blank" rel="noopener">
            X
          </a>

          <a id="lineButton" class="share-button line" href="#" target="_blank" rel="noopener">
            LINE
          </a>

          <button id="copyButton" class="share-button copy" type="button">
            URLをコピー
          </button>
        </div>

        <p id="copyMessage" class="photo-note"></p>
      </section>
    </article>

    <div class="back-buttons">
      <a href="index.html">トップへ戻る</a>
      <a href="archive.html">活動報告一覧</a>
    </div>
  </main>

  <footer>
    DXコードジェネレーターで作成
  </footer>

  <script>
    (function(){
      'use strict';

      var GAS_URL='https://script.google.com/macros/s/AKfycby4VxnadXWsXtn27EcABG-TEVP3b5oKUsKxoGzhztNolL6LojXTyb5h3-VXaIJRC7Xx/exec';
      var SITE_KEY='kakinuma-takashi-dx';

      var params=new URLSearchParams(location.search);
      var articleId=params.get('id')||'';

      var loadingMessage=document.getElementById('loadingMessage');
      var articleArea=document.getElementById('articleArea');
      var titleElement=document.getElementById('articleTitle');
      var dateElement=document.getElementById('articleDate');
      var bodyElement=document.getElementById('articleBody');
      var photoSection=document.getElementById('photoSection');
      var gallery=document.getElementById('articleGallery');
      var videoSection=document.getElementById('videoSection');
      var videoElement=document.getElementById('articleVideo');
      var copyMessage=document.getElementById('copyMessage');

      function escapeHtml(value){
        return String(value||'').replace(/[&<>"']/g,function(ch){
          return{
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
          }[ch];
        });
      }

      function safeUrl(value){
        var url=String(value||'').trim();
        return /^https:\/\//i.test(url)?url:'';
      }

      function youtubeId(value){
        var text=String(value||'');
        var match=text.match(
          /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([A-Za-z0-9_-]{6,})/i
        );

        return match?match[1]:'';
      }

      function showError(message){
        loadingMessage.textContent=message;
        loadingMessage.className='article-message';
      }

      function loadArticle(){
        if(!articleId){
          showError('記事IDが指定されていません。');
          return;
        }

        fetch(
          GAS_URL+'?action=publicArticles&siteKey='+encodeURIComponent(SITE_KEY),
          {cache:'no-store'}
        )
        .then(function(response){
          if(!response.ok){
            throw new Error('記事データを取得できません。');
          }
          return response.json();
        })
        .then(function(data){
          if(!data||!data.ok||!Array.isArray(data.articles)){
            throw new Error('公開記事を取得できません。');
          }

          var article=data.articles.find(function(item){
            return String(item.articleId||'')===String(articleId);
          });

          if(!article){
            throw new Error('この記事は見つかりません。');
          }

          renderArticle(article);
        })
        .catch(function(){
          showError('記事を読み込めませんでした。時間をおいて再度お試しください。');
        });
      }

      function renderArticle(article){
        titleElement.textContent=article.title||'活動報告';
        dateElement.textContent=article.publishDate||'';
        bodyElement.textContent=article.body||'';

        document.title=(article.title||'活動報告')+' | 柿沼貴志DX';

        var images=Array.isArray(article.images)?article.images:[];

        if(images.length){
          gallery.innerHTML='';

          images.slice(0,6).forEach(function(imageUrl){
            var url=safeUrl(imageUrl);
            if(!url)return;

            var image=document.createElement('img');
            image.src=url;
            image.alt=article.title||'活動報告の写真';
            image.loading='lazy';
            gallery.appendChild(image);
          });

          if(gallery.children.length){
            photoSection.classList.remove('hidden');
          }
        }

        var videoId=youtubeId(article.youtubeUrl);

        if(videoId){
          videoElement.innerHTML=
            '<iframe src="https://www.youtube.com/embed/'+
            encodeURIComponent(videoId)+
            '" title="'+
            escapeHtml(article.title||'活動報告の動画')+
            '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';

          videoSection.classList.remove('hidden');
        }

        var currentUrl=location.href;
        var shareUrl='share.html?id='+
          encodeURIComponent(article.articleId)+
          '&site='+
          encodeURIComponent(SITE_KEY);

        document.getElementById('facebookButton').href=
          'https://www.facebook.com/sharer/sharer.php?u='+
          encodeURIComponent(new URL(shareUrl,location.href).href);

        document.getElementById('xButton').href=
          'https://twitter.com/intent/tweet?text='+
          encodeURIComponent(article.title||'柿沼貴志議員 活動報告')+
          '&url='+
          encodeURIComponent(currentUrl);

        document.getElementById('lineButton').href=
          'https://line.me/R/msg/text/?'+
          encodeURIComponent((article.title||'活動報告')+'\n'+currentUrl);

        document.getElementById('copyButton').onclick=function(){
          copyUrl(currentUrl);
        };

        loadingMessage.classList.add('hidden');
        articleArea.classList.remove('hidden');
      }

      function copyUrl(url){
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(function(){
            copyMessage.textContent='記事URLをコピーしました。';
          }).catch(function(){
            fallbackCopy(url);
          });
          return;
        }

        fallbackCopy(url);
      }

      function fallbackCopy(url){
        var textarea=document.createElement('textarea');
        textarea.value=url;
        textarea.style.position='fixed';
        textarea.style.left='-9999px';
        document.body.appendChild(textarea);
        textarea.select();

        try{
          document.execCommand('copy');
          copyMessage.textContent='記事URLをコピーしました。';
        }catch(e){
          copyMessage.textContent='URLを長押ししてコピーしてください。';
        }

        document.body.removeChild(textarea);
      }

      loadArticle();
    })();
  </script>
</body>
</html>
