<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#263b52">
  <meta name="description" content="柿沼貴志議員の活動報告">
  <meta property="og:title" content="活動報告｜柿沼貴志">
  <meta property="og:description" content="柿沼貴志議員の活動報告をご紹介します。">
  <meta property="og:image" content="https://ichirohns-jpg.github.io/kakinuma-takashi-dx/profile_photo_3.jpg">
  <meta property="og:url" content="https://ichirohns-jpg.github.io/kakinuma-takashi-dx/article.html">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="manifest" href="manifest.json">

  <title>活動報告｜柿沼貴志</title>

  <style>
    :root{
      --navy:#263b52;
      --navy-deep:#1b2b3c;
      --orange:#d8792b;
      --cream:#f5f1ea;
      --paper:#fffdf9;
      --text:#29313a;
      --muted:#68727c;
      --line:#ddd7ce;
      --shadow:0 8px 26px rgba(35,48,61,.10);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--cream);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,
      "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      font-size:19px;
      line-height:1.9;
    }

    a{
      color:inherit;
      -webkit-tap-highlight-color:transparent;
    }

    img{
      display:block;
      max-width:100%;
    }

    button{
      font:inherit;
    }

    .hidden{
      display:none!important;
    }

    .site-header{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(255,253,249,.96);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(10px);
    }

    .header-inner{
      width:min(100% - 28px,900px);
      margin:auto;
      padding:12px 0 10px;
    }

    .header-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .site-name{
      display:block;
      color:var(--navy-deep);
      font-size:24px;
      font-weight:900;
      line-height:1.25;
      text-decoration:none;
      letter-spacing:.04em;
    }

    .site-name small{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-family:Georgia,serif;
      font-size:10px;
      letter-spacing:.14em;
    }

    .top-link{
      padding:10px 14px;
      border:1px solid var(--navy);
      border-radius:999px;
      color:var(--navy);
      font-size:15px;
      font-weight:900;
      text-decoration:none;
      white-space:nowrap;
    }

    main{
      width:min(100% - 28px,900px);
      margin:auto;
      padding:24px 0 60px;
    }

    .message{
      padding:30px 20px;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--paper);
      color:var(--muted);
      font-size:19px;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .message.error{
      color:#9c382c;
    }

    .article{
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--paper);
      box-shadow:var(--shadow);
    }

    .article-header{
      padding:clamp(26px,5vw,48px);
      border-bottom:1px solid var(--line);
    }

    .article-kicker{
      margin:0 0 10px;
      color:var(--orange);
      font-size:17px;
      font-weight:900;
      letter-spacing:.08em;
    }

    .article-date{
      margin:0 0 12px;
      color:var(--muted);
      font-size:18px;
      font-weight:900;
    }

    .article-title{
      margin:0;
      color:var(--navy-deep);
      font-size:clamp(34px,6vw,54px);
      line-height:1.45;
    }

    .article-author{
      margin:18px 0 0;
      color:var(--navy);
      font-size:20px;
      font-weight:900;
    }

    .article-body{
      padding:clamp(24px,5vw,48px);
    }

    .article-text{
      color:var(--text);
      font-size:20px;
      line-height:2.15;
      overflow-wrap:anywhere;
    }

    .article-text br{
      line-height:2.15;
    }

    .gallery{
      display:grid;
      gap:18px;
      margin-bottom:34px;
    }

    .gallery figure{
      margin:0;
      overflow:hidden;
      border-radius:15px;
      background:#ebe6de;
    }

    .gallery img{
      width:100%;
      max-height:850px;
      margin:auto;
      object-fit:contain;
    }

    .video-section{
      margin-top:34px;
    }

    .video-title{
      margin:0 0 12px;
      color:var(--navy-deep);
      font-size:25px;
      font-weight:900;
    }

    .video-frame{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      overflow:hidden;
      border-radius:15px;
      background:#000;
    }

    .video-frame iframe{
      width:100%;
      height:100%;
      border:0;
    }

    .share-section{
      margin-top:38px;
      padding-top:26px;
      border-top:1px solid var(--line);
    }

    .share-title{
      margin:0 0 14px;
      color:var(--navy-deep);
      font-size:25px;
      font-weight:900;
    }

    .share-buttons{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .share-button{
      min-height:58px;
      padding:13px 10px;
      border:0;
      border-radius:12px;
      color:#fff;
      font-size:17px;
      font-weight:900;
      cursor:pointer;
    }

    .share-button.line{
      background:#06c755;
    }

    .share-button.facebook{
      background:#1877f2;
    }

    .share-button.x{
      background:#111;
    }

    .share-button.native{
      background:var(--navy);
    }

    .share-button.copy{
      background:#68727c;
    }

    .share-message{
      min-height:28px;
      margin:12px 0 0;
      color:var(--muted);
      font-size:16px;
      text-align:center;
    }

    .back-links{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-top:24px;
    }

    .back-link{
      display:block;
      padding:13px 20px;
      border:1px solid var(--navy);
      border-radius:999px;
      color:var(--navy);
      font-size:17px;
      font-weight:900;
      text-decoration:none;
    }

    footer{
      padding:0 20px 34px;
      color:var(--muted);
      font-size:14px;
      text-align:center;
    }

    @media(max-width:620px){
      body{
        font-size:18px;
      }

      .header-inner{
        width:min(100% - 22px,900px);
      }

      .site-name{
        font-size:22px;
      }

      .top-link{
        padding:9px 11px;
        font-size:14px;
      }

      main{
        width:min(100% - 20px,900px);
        padding-top:14px;
      }

      .article{
        border-radius:17px;
      }

      .article-title{
        font-size:34px;
      }

      .article-author{
        font-size:18px;
      }

      .article-text{
        font-size:19px;
        line-height:2.05;
      }

      .share-buttons{
        grid-template-columns:1fr;
      }

      .back-links{
        flex-direction:column;
      }

      .back-link{
        text-align:center;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-top">
        <a class="site-name" href="index.html">
          柿沼貴志
          <small>TAKASHI KAKINUMA OFFICIAL INFORMATION</small>
        </a>

        <a class="top-link" href="archive.html">
          活動報告一覧
        </a>
      </div>
    </div>
  </header>

  <main>
    <div id="loading" class="message">
      活動報告を読み込んでいます。
    </div>

    <div id="error" class="message error hidden"></div>

    <article id="article" class="article hidden">
      <header class="article-header">
        <p class="article-kicker">柿沼貴志議員｜活動報告</p>
        <p id="articleDate" class="article-date"></p>
        <h1 id="articleTitle" class="article-title"></h1>
        <p class="article-author">埼玉県議会議員　柿沼貴志</p>
      </header>

      <div class="article-body">
        <div id="articleImages" class="gallery"></div>

        <div id="articleText" class="article-text"></div>

        <section id="videoSection" class="video-section hidden">
          <h2 class="video-title">関連動画</h2>
          <div class="video-frame">
            <iframe
              id="youtubeFrame"
              title="YouTube動画"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
        </section>

        <section class="share-section">
          <h2 class="share-title">この記事を共有する</h2>

          <div class="share-buttons">
            <button class="share-button native" id="nativeShareButton" type="button">
              共有メニューを開く
            </button>

            <button class="share-button line" id="lineShareButton" type="button">
              LINEで共有
            </button>

            <button class="share-button facebook" id="facebookShareButton" type="button">
              Facebookで共有
            </button>

            <button class="share-button x" id="xShareButton" type="button">
              Xで共有
            </button>

            <button class="share-button copy" id="copyShareButton" type="button">
              URLをコピー
            </button>
          </div>

          <p id="shareMessage" class="share-message"></p>
        </section>
      </div>
    </article>

    <div class="back-links">
      <a class="back-link" href="archive.html">活動報告一覧へ</a>
      <a class="back-link" href="index.html">トップページへ</a>
    </div>
  </main>

  <footer>
    柿沼貴志 活動報告DX
  </footer>

  <script>
    (function(){
      'use strict';

      var GAS_URL='https://script.google.com/macros/s/AKfycby4VxnadXWsXtn27EcABG-TEVP3b5oKUsKxoGzhztNolL6LojXTyb5h3-VXaIJRC7Xx/exec';
      var SITE_KEY='kakinuma-takashi-dx';

      var loading=document.getElementById('loading');
      var errorBox=document.getElementById('error');
      var articleBox=document.getElementById('article');
      var titleBox=document.getElementById('articleTitle');
      var dateBox=document.getElementById('articleDate');
      var textBox=document.getElementById('articleText');
      var imagesBox=document.getElementById('articleImages');
      var videoSection=document.getElementById('videoSection');
      var youtubeFrame=document.getElementById('youtubeFrame');
      var shareMessage=document.getElementById('shareMessage');

      var currentUrl=window.location.href.split('#')[0];
      var currentArticle=null;

      function escapeHtml(value){
        return String(value||'').replace(/[&<>\"']/g,function(ch){
          return {
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '\"':'&quot;',
            "'":'&#39;'
          }[ch];
        });
      }

      function imageValue(value){
        if(value&&typeof value==='object'){
          return String(
            value.url||
            value.src||
            value.imageUrl||
            value.value||
            ''
          ).trim();
        }

        return String(value||'').trim();
      }

      function decodeValue(value){
        try{
          return decodeURIComponent(value);
        }catch(error){
          return value;
        }
      }

      function driveFileId(value){
        var url=imageValue(value);
        var match=url.match(
          /drive\.google\.com\/file\/d\/([^/?#]+)/i
        );

        if(match){
          return decodeValue(match[1]);
        }

        match=url.match(
          /(?:drive\.google\.com|drive\.usercontent\.google\.com)\/[^?#]*[?&]id=([^&#]+)/i
        );

        if(match){
          return decodeValue(match[1]);
        }

        match=url.match(
          /lh3\.googleusercontent\.com\/d\/([^=/?#]+)/i
        );

        if(match){
          return decodeValue(match[1]);
        }

        return '';
      }

      function safeImageUrl(value){
        var url=imageValue(value);

        if(!url){
          return '';
        }

        var driveId=driveFileId(url);

        if(driveId){
          return 'https://drive.google.com/thumbnail?id='+
            encodeURIComponent(driveId)+
            '&sz=w1600';
        }

        if(/^data:image\//i.test(url)){
          return url;
        }

        if(/^https?:\/\//i.test(url)){
          return url;
        }

        if(/^(?:\.{0,2}\/|\/)[^\s]+/.test(url)){
          return url;
        }

        return '';
      }

      function plainText(value){
        var source=String(value||'')
          .replace(/<br\s*\/?>/gi,'\n')
          .replace(/<\/p\s*>/gi,'\n\n');

        var box=document.createElement('div');
        box.innerHTML=source;

        return (box.textContent||box.innerText||'')
          .replace(/\r\n/g,'\n')
          .replace(/\r/g,'\n')
          .replace(/[ \t]+/g,' ')
          .replace(/\n{3,}/g,'\n\n')
          .trim();
      }

      function first(row,keys){
        for(var i=0;i<keys.length;i++){
          var key=keys[i];

          if(
            row &&
            row[key]!==undefined &&
            row[key]!==null &&
            String(row[key]).trim()!==''
          ){
            return row[key];
          }
        }

        return '';
      }

      function formatDate(value){
        var text=String(value||'').trim();

        if(!text){
          return '';
        }

        var japanese=text.match(
          /^(\d{4})年(\d{1,2})月(\d{1,2})日/
        );

        if(japanese){
          return japanese[1]+'年'+
            Number(japanese[2])+'月'+
            Number(japanese[3])+'日';
        }

        var direct=text.match(
          /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/
        );

        if(direct){
          return direct[1]+'年'+
            Number(direct[2])+'月'+
            Number(direct[3])+'日';
        }

        var date=new Date(text);

        if(isNaN(date.getTime())){
          return text;
        }

        try{
          var parts=new Intl.DateTimeFormat(
            'ja-JP',
            {
              timeZone:'Asia/Tokyo',
              year:'numeric',
              month:'numeric',
              day:'numeric'
            }
          ).formatToParts(date);

          var result={};

          parts.forEach(function(part){
            if(
              part.type==='year'||
              part.type==='month'||
              part.type==='day'
            ){
              result[part.type]=part.value;
            }
          });

          if(result.year&&result.month&&result.day){
            return result.year+'年'+
              Number(result.month)+'月'+
              Number(result.day)+'日';
          }
        }catch(error){
          return date.getFullYear()+'年'+
            (date.getMonth()+1)+'月'+
            date.getDate()+'日';
        }

        return date.getFullYear()+'年'+
          (date.getMonth()+1)+'月'+
          date.getDate()+'日';
      }

      function youtubeId(value){
        var match=String(value||'').match(
          /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{6,})/i
        );

        return match?match[1]:'';
      }

      function normalize(row){
        var images=[];

        if(Array.isArray(row&&row.images)){
          images=images.concat(row.images);
        }else if(
          row &&
          typeof row.images==='string' &&
          row.images.trim().charAt(0)==='['
        ){
          try{
            images=images.concat(JSON.parse(row.images));
          }catch(error){}
        }

        for(var i=1;i<=6;i++){
          images.push(first(row,[
            'image'+i,
            '画像'+i,
            'photo'+i
          ]));
        }

        var imageUrls=images
          .map(safeImageUrl)
          .filter(Boolean)
          .filter(function(value,index,array){
            return array.indexOf(value)===index;
          });

        if(!imageUrls.length){
          var ogp=safeImageUrl(
            first(row,['ogpImage','ogp','シェア画像'])
          );

          if(ogp){
            imageUrls.push(ogp);
          }
        }

        return {
          id:String(first(row,[
            'articleId',
            'id',
            '記事ID'
          ])||'').trim(),

          title:String(first(row,[
            'title',
            'articleTitle',
            '記事タイトル'
          ])||'活動報告').trim(),

          date:String(first(row,[
            'publishDate',
            'date',
            '公開日',
            'createdAt',
            '作成日'
          ])||'').trim(),

          body:String(first(row,[
            'body',
            'articleBody',
            '本文',
            '記事本文'
          ])||'').trim(),

          youtube:String(first(row,[
            'youtubeUrl',
            'youtubeURL',
            'YouTube',
            '動画URL',
            'videoUrl'
          ])||'').trim(),

          images:imageUrls
        };
      }

      function showError(message){
        loading.classList.add('hidden');
        articleBox.classList.add('hidden');
        errorBox.textContent=message;
        errorBox.classList.remove('hidden');
      }

      function renderImages(images){
        imagesBox.innerHTML='';

        images.forEach(function(url,index){
          var figure=document.createElement('figure');
          var image=document.createElement('img');

          image.src=url;
          image.alt='柿沼貴志 活動報告 写真'+(index+1);
          image.loading=index===0?'eager':'lazy';
          image.referrerPolicy='no-referrer';

          image.onerror=function(){
            figure.remove();
          };

          figure.appendChild(image);
          imagesBox.appendChild(figure);
        });
      }

      function renderVideo(url){
        var id=youtubeId(url);

        if(!id){
          videoSection.classList.add('hidden');
          return;
        }

        youtubeFrame.src=
          'https://www.youtube.com/embed/'+
          encodeURIComponent(id)+
          '?rel=0';

        videoSection.classList.remove('hidden');
      }

      function renderArticle(article){
        currentArticle=article;

        document.title=article.title+'｜柿沼貴志';

        titleBox.textContent=article.title;
        dateBox.textContent=formatDate(article.date);
        textBox.innerHTML=escapeHtml(
          plainText(article.body)
        ).replace(/\n/g,'<br>');

        renderImages(article.images);
        renderVideo(article.youtube);

        loading.classList.add('hidden');
        errorBox.classList.add('hidden');
        articleBox.classList.remove('hidden');
      }

      function shareText(){
        return '柿沼貴志 活動報告\n'+
          (currentArticle?currentArticle.title:'')+
          '\n'+
          currentUrl;
      }

      function openShare(url){
        window.open(
          url,
          '_blank',
          'noopener,noreferrer'
        );
      }

      function copyCurrentUrl(){
        if(
          navigator.clipboard &&
          navigator.clipboard.writeText
        ){
          navigator.clipboard.writeText(currentUrl)
            .then(function(){
              shareMessage.textContent=
                '記事URLをコピーしました。';
            })
            .catch(function(){
              fallbackCopy();
            });

          return;
        }

        fallbackCopy();
      }

      function fallbackCopy(){
        var textarea=document.createElement('textarea');

        textarea.value=currentUrl;
        textarea.style.position='fixed';
        textarea.style.opacity='0';

        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();

        try{
          document.execCommand('copy');
          shareMessage.textContent=
            '記事URLをコピーしました。';
        }catch(error){
          shareMessage.textContent=
            'URLをコピーできませんでした。';
        }

        document.body.removeChild(textarea);
      }

      document.getElementById('nativeShareButton')
        .addEventListener('click',function(){
          if(navigator.share){
            navigator.share({
              title:currentArticle
                ? currentArticle.title+'｜柿沼貴志'
                : '柿沼貴志 活動報告',
              text:shareText(),
              url:currentUrl
            }).catch(function(error){
              if(!error||error.name!=='AbortError'){
                copyCurrentUrl();
              }
            });
          }else{
            copyCurrentUrl();
          }
        });

      document.getElementById('lineShareButton')
        .addEventListener('click',function(){
          openShare(
            'https://line.me/R/msg/text/?'+
            encodeURIComponent(shareText())
          );
        });

      document.getElementById('facebookShareButton')
        .addEventListener('click',function(){
          openShare(
            'https://www.facebook.com/sharer/sharer.php?u='+
            encodeURIComponent(currentUrl)
          );
        });

      document.getElementById('xShareButton')
        .addEventListener('click',function(){
          openShare(
            'https://twitter.com/intent/tweet?text='+
            encodeURIComponent(
              currentArticle
                ? currentArticle.title+'｜柿沼貴志'
                : '柿沼貴志 活動報告'
            )+
            '&url='+
            encodeURIComponent(currentUrl)
          );
        });

      document.getElementById('copyShareButton')
        .addEventListener('click',copyCurrentUrl);

      var params=new URLSearchParams(window.location.search);
      var targetId=params.get('id')||'';

      if(!targetId){
        showError('記事番号が見つかりません。');
        return;
      }

      fetch(
        GAS_URL+
        '?action=publicArticles&siteKey='+
        encodeURIComponent(SITE_KEY)+
        '&_='+
        Date.now(),
        {
          cache:'no-store'
        }
      )
      .then(function(response){
        if(!response.ok){
          throw new Error('記事データを取得できません。');
        }

        return response.json();
      })
      .then(function(data){
        var rows=
          data&&Array.isArray(data.articles)
            ? data.articles
            : [];

        var article=rows
          .map(normalize)
          .find(function(item){
            return item.id===targetId;
          });

        if(!article){
          showError('この記事は見つかりません。');
          return;
        }

        renderArticle(article);
      })
      .catch(function(){
        showError(
          '活動報告を読み込めませんでした。'
        );
      });
    })();
  </script>
</body>
</html>
