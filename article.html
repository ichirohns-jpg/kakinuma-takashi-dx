<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>活動報告を書く</title>

  <style>
    :root{
      --orange:#d66d29;
      --dark:#6f3516;
      --soft:#fff5eb;
      --line:#ead5c4;
      --text:#2e241e;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:linear-gradient(180deg,var(--soft),#fff 55%);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,
      "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      font-size:17px;
      line-height:1.7;
    }

    header{
      padding:20px 16px;
      background:var(--orange);
      color:#fff;
      box-shadow:0 3px 12px #0002;
    }

    header h1{
      margin:0;
      font-size:24px;
      line-height:1.3;
    }

    header p{
      margin:6px 0 0;
      font-size:14px;
    }

    main{
      max-width:760px;
      margin:auto;
      padding:16px 12px 44px;
    }

    .panel{
      margin:14px 0;
      padding:20px 16px;
      border:2px solid var(--line);
      border-radius:20px;
      background:#fffffff5;
      box-shadow:0 5px 18px #7b4b2214;
    }

    h2{
      margin:0 0 14px;
      color:var(--dark);
      font-size:22px;
    }

    label{
      display:block;
      margin:16px 0 7px;
      color:var(--dark);
      font-weight:800;
    }

    input,
    textarea,
    select{
      width:100%;
      padding:13px 12px;
      border:1px solid #cdb9a8;
      border-radius:11px;
      background:#fff;
      color:var(--text);
      font:inherit;
      font-size:17px;
    }

    input[type="file"]{
      padding:10px;
      background:#fffaf6;
      font-size:16px;
    }

    textarea{
      min-height:150px;
      resize:vertical;
    }

    .small{
      color:#75695f;
      font-size:14px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0 12px;
    }

    button{
      width:100%;
      margin-top:14px;
      padding:14px 12px;
      border:0;
      border-radius:12px;
      background:var(--orange);
      color:#fff;
      font:inherit;
      font-size:17px;
      font-weight:900;
      cursor:pointer;
    }

    button.secondary{
      background:#f3e4d7;
      color:var(--dark);
    }

    button.danger{
      border:1px solid #e5aaa0;
      background:#fff0ed;
      color:#a03528;
    }

    button:disabled{
      opacity:.55;
    }

    .hidden{
      display:none!important;
    }

    .message{
      margin:14px 0;
      padding:13px;
      border-radius:11px;
      background:#f7f2ed;
      color:var(--dark);
      white-space:pre-wrap;
    }

    .message.error{
      background:#fff0ed;
      color:#a03528;
    }

    .message.success{
      background:#edf8ef;
      color:#236b36;
    }

    .image-item{
      margin:12px 0;
      padding:12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fffaf6;
    }

    .image-item label{
      margin:0 0 8px;
      font-size:16px;
    }

    .image-preview{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:110px;
      margin-top:9px;
      overflow:hidden;
      border-radius:10px;
      background:#f1e8df;
      color:#8b7b70;
      font-size:14px;
      text-align:center;
    }

    .image-preview img{
      display:block;
      width:100%;
      max-height:220px;
      object-fit:contain;
    }

    .image-status{
      margin:6px 0 0;
      color:#75695f;
      font-size:13px;
    }

    .article{
      margin:12px 0;
      padding:15px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fffaf6;
    }

    .article h3{
      margin:0;
      color:var(--dark);
      font-size:19px;
    }

    .article-meta{
      margin:4px 0;
      color:#75695f;
      font-size:14px;
    }

    .article-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    @media(max-width:560px){
      .grid{
        display:block;
      }

      .article-actions{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>活動報告を書く</h1>
    <p>管理者専用・柿沼貴志議員 活動報告DX</p>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <h2>管理者ログイン</h2>
      <p class="small">管理者パスワードを入力してください。</p>

      <label for="password">パスワード</label>
      <input
        id="password"
        type="password"
        inputmode="numeric"
        autocomplete="current-password"
      >

      <button id="loginButton" type="button">ログイン</button>
      <div id="loginMessage" class="message hidden"></div>
    </section>

    <section id="editorPanel" class="hidden">
      <div class="panel">
        <h2>記事を書く</h2>

        <p class="small">
          写真は「写真を選択」を押して、iPhoneの写真から直接登録します。
          最大6枚。YouTubeは動画URLを入力すると記事内で再生されます。
        </p>

        <input id="articleId" type="hidden">

        <div class="grid">
          <div>
            <label for="siteKey">サイト識別名</label>
            <input id="siteKey" value="kakinuma-takashi-dx" autocomplete="off">
          </div>

          <div>
            <label for="requestId">受付番号（任意）</label>
            <input id="requestId" placeholder="REQ-..." autocomplete="off">
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="publishDate">記事の日付</label>
            <input id="publishDate" type="date">
          </div>

          <div>
            <label for="status">状態</label>
            <select id="status">
              <option>下書き</option>
              <option>公開</option>
              <option>非公開</option>
            </select>
          </div>
        </div>

        <label for="title">記事タイトル</label>
        <input
          id="title"
          placeholder="例：県議会で地域の課題を質問しました"
        >

        <label for="body">記事本文</label>
        <textarea
          id="body"
          placeholder="段落ごとに改行して入力してください。"
        ></textarea>

        <label>写真（iPhoneから直接選択・最大6枚）</label>
        <div id="imageFields"></div>

        <label for="youtubeUrl">YouTube動画URL（任意）</label>
        <input
          id="youtubeUrl"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
        >

        <label for="ogpImage">シェア用画像（任意）</label>
        <p class="small">
          空欄の場合は、1枚目に選んだ写真を使用します。
        </p>
        <input
          id="ogpImage"
          type="url"
          placeholder="通常は空欄で大丈夫です"
        >

        <label for="publicUrl">公開ページURL</label>
        <input
          id="publicUrl"
          type="url"
          value="https://ichirohns-jpg.github.io/kakinuma-takashi-dx/"
        >

        <label for="sortOrder">表示順（通常は0）</label>
        <input
          id="sortOrder"
          type="number"
          value="0"
          inputmode="numeric"
        >

        <label for="note">管理メモ（任意）</label>
        <input id="note" placeholder="管理者だけが見るメモ">

        <button id="saveDraftButton" type="button">下書き保存</button>
        <button id="publishButton" type="button">公開する</button>
        <button id="newButton" class="secondary" type="button">
          新しい記事に戻す
        </button>
        <button id="logoutButton" class="secondary" type="button">
          ログアウト
        </button>

        <div id="editorMessage" class="message hidden"></div>
      </div>

      <div class="panel">
        <h2>記事一覧</h2>

        <button id="reloadButton" class="secondary" type="button">
          記事一覧を更新
        </button>

        <div id="articleList">
          <p class="small">読み込み中です。</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function(){
      'use strict';

      var token='';
      var existingImages=[];

      var $=function(id){
        return document.getElementById(id);
      };

      var imageFields=$('imageFields');

      function createImageField(number){
        var item=document.createElement('div');
        item.className='image-item';

        var label=document.createElement('label');
        label.textContent='写真'+number;
        label.setAttribute('for','image_'+number);

        var input=document.createElement('input');
        input.id='image_'+number;
        input.type='file';
        input.accept='image/*';

        var preview=document.createElement('div');
        preview.id='preview_'+number;
        preview.className='image-preview';
        preview.textContent='写真を選択してください';

        var status=document.createElement('p');
        status.id='image_status_'+number;
        status.className='image-status';
        status.textContent='未選択';

        input.addEventListener('change',function(){
          var file=input.files&&input.files[0];

          if(!file){
            showExistingPreview(number);
            return;
          }

          if(!file.type||file.type.indexOf('image/')!==0){
            input.value='';
            preview.textContent='画像ファイルを選択してください';
            status.textContent='選択できないファイルです';
            return;
          }

          var reader=new FileReader();

          reader.onload=function(){
            preview.innerHTML='';

            var image=document.createElement('img');
            image.src=reader.result;
            image.alt='写真'+number+'プレビュー';
            preview.appendChild(image);

            status.textContent=file.name+'を選択中';
          };

          reader.readAsDataURL(file);
        });

        item.appendChild(label);
        item.appendChild(input);
        item.appendChild(preview);
        item.appendChild(status);
        imageFields.appendChild(item);
      }

      for(var fieldNumber=1;fieldNumber<=6;fieldNumber++){
        createImageField(fieldNumber);
      }

      function message(el,text,type){
        el.textContent=text;
        el.className='message '+(type||'');
        el.classList.remove('hidden');
      }

      function hide(el){
        el.classList.add('hidden');
      }

      function showExistingPreview(number){
        var preview=$('preview_'+number);
        var status=$('image_status_'+number);
        var url=existingImages[number-1]||'';

        preview.innerHTML='';

        if(!url){
          preview.textContent='写真を選択してください';
          status.textContent='未選択';
          return;
        }

        var image=document.createElement('img');
        image.src=url;
        image.alt='登録済み写真'+number;

        image.onerror=function(){
          preview.textContent='登録済み画像を表示できません';
        };

        preview.appendChild(image);
        status.textContent=
          '登録済み。変更しない場合はこの写真を使用します';
      }

      function run(name,args,ok){
        var runner=google.script.run
          .withSuccessHandler(ok)
          .withFailureHandler(function(err){
            message(
              $('editorMessage'),
              err&&err.message||String(err),
              'error'
            );
          });

        runner[name].apply(runner,args);
      }

      function login(){
        var button=$('loginButton');

        button.disabled=true;
        button.textContent='確認中…';
        hide($('loginMessage'));

        google.script.run
          .withSuccessHandler(function(data){
            if(!data||!data.ok){
              message(
                $('loginMessage'),
                data&&data.error||'ログインできません。',
                'error'
              );

              button.disabled=false;
              button.textContent='ログイン';
              return;
            }

            token=data.token;
            $('loginPanel').classList.add('hidden');
            $('editorPanel').classList.remove('hidden');
            loadList();
          })
          .withFailureHandler(function(err){
            message(
              $('loginMessage'),
              err&&err.message||String(err),
              'error'
            );

            button.disabled=false;
            button.textContent='ログイン';
          })
          .adminLogin($('password').value);
      }

      function readFileAsDataUrl(file){
        return new Promise(function(resolve,reject){
          var reader=new FileReader();

          reader.onload=function(){
            resolve(reader.result);
          };

          reader.onerror=function(){
            reject(new Error('写真を読み込めませんでした。'));
          };

          reader.readAsDataURL(file);
        });
      }

      function loadImage(dataUrl){
        return new Promise(function(resolve,reject){
          var image=new Image();

          image.onload=function(){
            resolve(image);
          };

          image.onerror=function(){
            reject(new Error('写真を読み込めませんでした。'));
          };

          image.src=dataUrl;
        });
      }

      async function compressImage(file){
        var source=await readFileAsDataUrl(file);
        var image=await loadImage(source);
        var edgeList=[900,760,640,520,420];
        var qualityList=[0.72,0.62,0.52,0.44,0.36];
        var best='';

        for(var e=0;e<edgeList.length;e++){
          var maxEdge=edgeList[e];
          var ratio=Math.min(
            1,
            maxEdge/Math.max(image.width,image.height)
          );

          var width=Math.max(1,Math.round(image.width*ratio));
          var height=Math.max(1,Math.round(image.height*ratio));
          var canvas=document.createElement('canvas');

          canvas.width=width;
          canvas.height=height;

          var context=canvas.getContext('2d');

          context.fillStyle='#ffffff';
          context.fillRect(0,0,width,height);
          context.drawImage(image,0,0,width,height);

          for(var q=0;q<qualityList.length;q++){
            var result=canvas.toDataURL(
              'image/jpeg',
              qualityList[q]
            );

            best=result;

            if(result.length<=45000){
              return result;
            }
          }
        }

        return best;
      }

      async function collect(status){
        var images=[];

        for(var i=1;i<=6;i++){
          var input=$('image_'+i);
          var file=input.files&&input.files[0];

          if(file){
            images.push(await compressImage(file));
          }else{
            images.push(existingImages[i-1]||'');
          }
        }

        return {
          articleId:$('articleId').value.trim(),
          siteKey:$('siteKey').value.trim(),
          requestId:$('requestId').value.trim(),
          publishDate:$('publishDate').value,
          title:$('title').value.trim(),
          body:$('body').value.trim(),
          images:images,
          youtubeUrl:$('youtubeUrl').value.trim(),
          ogpImage:$('ogpImage').value.trim(),
          status:status||$('status').value,
          publicUrl:$('publicUrl').value.trim(),
          sortOrder:Number($('sortOrder').value||0),
          note:$('note').value.trim()
        };
      }

      async function save(status){
        var button=status==='公開'
          ? $('publishButton')
          : $('saveDraftButton');

        if(
          !$('title').value.trim()||
          !$('body').value.trim()
        ){
          message(
            $('editorMessage'),
            '記事タイトルと本文を入力してください。',
            'error'
          );
          return;
        }

        button.disabled=true;
        button.textContent=status==='公開'
          ? '公開中…'
          : '保存中…';

        hide($('editorMessage'));

        try{
          var article=await collect(status);

          run(
            'postArticleSave',
            [token,article],
            function(data){
              button.disabled=false;
              button.textContent=status==='公開'
                ? '公開する'
                : '下書き保存';

              if(!data||!data.ok){
                message(
                  $('editorMessage'),
                  data&&data.error||'保存できません。',
                  'error'
                );
                return;
              }

              $('articleId').value=data.article.articleId;
              $('status').value=data.article.status;
              existingImages=
                data.article.images||
                article.images||
                [];

              message(
                $('editorMessage'),
                data.message+
                '\n記事ID：'+
                data.article.articleId,
                'success'
              );

              loadList();
            }
          );
        }catch(error){
          button.disabled=false;
          button.textContent=status==='公開'
            ? '公開する'
            : '下書き保存';

          message(
            $('editorMessage'),
            error&&error.message||
            '写真を処理できませんでした。',
            'error'
          );
        }
      }

      function resetForm(){
        $('articleId').value='';
        $('requestId').value='';
        $('publishDate').value='';
        $('title').value='';
        $('body').value='';
        $('youtubeUrl').value='';
        $('ogpImage').value='';
        $('sortOrder').value='0';
        $('note').value='';
        $('status').value='下書き';
        existingImages=[];

        for(var i=1;i<=6;i++){
          $('image_'+i).value='';
          showExistingPreview(i);
        }

        hide($('editorMessage'));
        window.scrollTo({
          top:0,
          behavior:'smooth'
        });
      }

      function edit(article){
        $('articleId').value=article.articleId||'';
        $('siteKey').value=
          article.siteKey||
          'kakinuma-takashi-dx';

        $('requestId').value=article.requestId||'';
        $('publishDate').value=article.publishDate||'';
        $('title').value=article.title||'';
        $('body').value=article.body||'';
        $('youtubeUrl').value=article.youtubeUrl||'';
        $('ogpImage').value=article.ogpImage||'';
        $('status').value=article.status||'下書き';
        $('publicUrl').value=
          article.publicUrl||
          $('publicUrl').value;

        $('sortOrder').value=article.sortOrder||0;
        $('note').value=article.note||'';
        existingImages=article.images||[];

        for(var i=1;i<=6;i++){
          $('image_'+i).value='';
          showExistingPreview(i);
        }

        window.scrollTo({
          top:0,
          behavior:'smooth'
        });

        message(
          $('editorMessage'),
          '記事を読み込みました。写真を変更する場合は、写真を選び直してください。',
          'success'
        );
      }

      function loadList(){
        $('articleList').innerHTML=
          '<p class="small">読み込み中です。</p>';

        run(
          'postArticleList',
          [
            token,
            $('siteKey').value.trim()
          ],
          function(data){
            if(!data||!data.ok){
              $('articleList').textContent=
                data&&data.error||
                '読み込めません。';

              return;
            }

            if(!data.articles.length){
              $('articleList').innerHTML=
                '<p class="small">まだ記事がありません。</p>';

              return;
            }

            $('articleList').innerHTML='';

            data.articles.forEach(function(article){
              var box=document.createElement('div');
              box.className='article';

              var heading=document.createElement('h3');
              heading.textContent=
                article.title||
                '(タイトルなし)';

              var meta=document.createElement('p');
              meta.className='article-meta';
              meta.textContent=
                (article.publishDate||'日付なし')+
                '　｜　'+
                (article.status||'');

              var actions=document.createElement('div');
              actions.className='article-actions';

              var editButton=document.createElement('button');
              editButton.type='button';
              editButton.className='secondary';
              editButton.textContent='この記事を修正';

              editButton.onclick=function(){
                edit(article);
              };

              var hideButton=document.createElement('button');
              hideButton.type='button';
              hideButton.className='danger';
              hideButton.textContent='非公開にする';

              hideButton.onclick=function(){
                if(!confirm('この記事を非公開にしますか？')){
                  return;
                }

                run(
                  'postArticleHide',
                  [
                    token,
                    article.articleId
                  ],
                  function(result){
                    message(
                      $('editorMessage'),
                      result.message||
                      '非公開にしました。',
                      'success'
                    );

                    loadList();
                  }
                );
              };

              actions.appendChild(editButton);
              actions.appendChild(hideButton);
              box.appendChild(heading);
              box.appendChild(meta);
              box.appendChild(actions);
              $('articleList').appendChild(box);
            });
          }
        );
      }

      $('loginButton').onclick=login;

      $('password').addEventListener('keydown',function(event){
        if(event.key==='Enter'){
          login();
        }
      });

      $('saveDraftButton').onclick=function(){
        save('下書き');
      };

      $('publishButton').onclick=function(){
        save('公開');
      };

      $('newButton').onclick=resetForm;
      $('reloadButton').onclick=loadList;

      $('logoutButton').onclick=function(){
        google.script.run
          .withSuccessHandler(function(){
            location.reload();
          })
          .adminLogout(token);
      };
    })();
  </script>
</body>
</html>
