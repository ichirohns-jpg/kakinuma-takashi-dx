<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b4c">
  <title>柿沼貴志｜活動報告更新</title>
  <style>
    :root{--g:#0b6b4c;--d:#073f2d;--m:#e7f6eb;--gold:#e8b84f;--ink:#1c3026;--muted:#66776c;--line:#d6e8da;--danger:#b42318;--paper:#f7fbf7}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:17px;line-height:1.7}
    button,input,select,textarea{font:inherit}button,label{cursor:pointer}
    .top{padding:20px 16px;background:linear-gradient(135deg,var(--d),var(--g));color:#fff}.inner,main{width:min(100% - 24px,820px);margin:auto}.top h1{margin:0;font-size:clamp(25px,7vw,38px);line-height:1.3}.top p{margin:5px 0 0;color:#ddf1e2}main{padding:14px 0 50px}
    .card{margin:14px 0;padding:20px 16px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 24px #073f2d12}.card h2{margin:0 0 14px;color:var(--d);font-size:24px}.field{margin-bottom:16px}.field:last-child{margin-bottom:0}label{display:block;margin-bottom:6px;font-weight:900}
    input,select,textarea{width:100%;border:1px solid #cbded0;border-radius:11px;background:#fff;color:var(--ink);font-size:17px}input,select{min-height:50px;padding:9px 11px}textarea{min-height:170px;padding:10px 11px;resize:vertical}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 4px #0b6b4c1c}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.paste-row{display:flex;gap:8px}.paste-row input{flex:1;min-width:0}.paste-button{min-width:145px;padding:8px 12px;border:1px solid var(--g);border-radius:11px;background:var(--m);color:var(--g);font-weight:900}.video-preview{display:none;position:relative;width:100%;margin-top:12px;padding-top:56.25%;overflow:hidden;border-radius:13px;background:#001c14}.video-preview.open{display:block}.video-preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.button{min-height:50px;padding:9px 15px;border:1px solid var(--g);border-radius:999px;background:var(--g);color:#fff;font-weight:900}.button.secondary{background:#fff;color:var(--g)}.button.gold{border-color:var(--gold);background:var(--gold);color:var(--d)}.button.danger{border-color:var(--danger);background:#fff;color:var(--danger)}
    .status{display:none;margin-top:14px;padding:13px;border-radius:12px;white-space:pre-wrap}.status.show{display:block}.status.ok{background:#e8f7eb;color:#21613d}.status.error{background:#fff0f0;color:#8d2727}.status.loading{background:#edf5ff;color:#28547f}.hidden{display:none!important}
    .article-list{display:grid;gap:10px}.article-item{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fbfefb}.article-item strong{display:block;color:var(--d);font-size:18px}.article-item small{display:block;color:var(--muted)}.article-item p{margin:7px 0;color:#385344;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.preview figure{width:140px;margin:0;overflow:hidden;border-radius:10px;background:var(--m)}.preview img{width:140px;height:105px;object-fit:contain;background:#eef8f0}.preview figcaption{padding:3px;color:var(--muted);font-size:11px;text-align:center}.preview-remove{width:100%;min-height:38px;border:1px solid var(--danger);border-radius:9px;background:#fff;color:var(--danger);font-size:13px;font-weight:900}.help{margin:5px 0;color:var(--muted);font-size:13px}.count{margin:6px 0;color:var(--muted);text-align:center}.site-link{display:inline-block;margin-top:10px;color:var(--g);font-weight:900}.footer{padding:24px;color:var(--muted);font-size:13px;text-align:center}
    .bridge{position:fixed;width:1px;height:1px;left:-100px;top:-100px;border:0;opacity:0;pointer-events:none}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.button{width:100%;min-height:54px}.paste-row{display:grid;grid-template-columns:1fr}.paste-button{width:100%;min-height:52px}.preview figure{width:calc(50% - 4px)}.preview img{width:100%;height:120px}}
  </style>
</head>
<body>
  <header class="top"><div class="inner"><h1>柿沼貴志｜活動報告更新</h1><p>記事・写真・YouTubeを管理します。</p></div></header>
  <main>
    <section class="card"><h2>管理者ログイン</h2><div class="field"><label for="password">管理パスワード</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password"></div><div class="actions"><button id="loginButton" class="button" type="button">ログインして記事一覧を読み込む</button></div><div id="status" class="status"></div></section>
    <div id="operationArea" class="hidden">
      <section class="card"><h2>保存済みの記事</h2><div class="actions"><button id="newButton" class="button secondary" type="button">新しい記事を書く</button></div><div id="articleList" class="article-list"><p class="help">記事一覧を読み込んでください。</p></div></section>
      <form id="editor" class="card">
        <h2 id="editorTitle">新しい活動報告</h2><input id="articleId" type="hidden"><input id="requestId" type="hidden">
        <div class="grid"><div class="field"><label for="publishDate">日付</label><input id="publishDate" type="date" required></div><div class="field"><label for="statusSelect">公開状態</label><select id="statusSelect"><option value="公開">公開</option><option value="下書き">下書き</option><option value="非公開">非公開</option></select></div></div>
        <div class="field"><label for="title">活動報告タイトル</label><input id="title" required></div>
        <div class="field"><label for="body">活動報告本文</label><textarea id="body" required></textarea></div>
        <div class="field"><label for="youtubeUrl">YouTube動画URL（共有からコピーして貼り付け）</label><div class="paste-row"><input id="youtubeUrl" type="text" inputmode="url" autocomplete="url" placeholder="YouTubeの共有→リンクをコピー"><button id="pasteYoutube" class="paste-button" type="button">コピーを貼る</button></div><p class="help">YouTubeアプリの「共有」→「リンクをコピー」→この欄へ貼り付けます。保存後、公開ページ内で再生します。</p><div id="youtubePreview" class="video-preview"></div></div>
        <div class="grid"><div class="field"><label for="publicUrl">公開ページURL</label><input id="publicUrl" type="url" value="https://ichirohns-jpg.github.io/kakinuma-takashi-dx/"></div><div class="field"><label for="sortOrder">表示順</label><input id="sortOrder" type="number" value="0"></div></div>
        <div class="field"><label for="ogpImage">共有時の画像URL（任意）</label><input id="ogpImage" type="url" placeholder="空欄なら記事1枚目を使用"></div>
        <div class="field"><label for="note">管理メモ（任意）</label><textarea id="note" style="min-height:90px" placeholder="管理者だけが見るメモ"></textarea></div>
        <div class="field"><label for="imageFiles">活動報告写真（最大6枚）</label><input id="imageFiles" type="file" accept="image/*" multiple><p class="help">保存済み写真の「この写真を外す」で削除してから、新しい写真を選ぶと交換できます。</p><p id="photoCount" class="count">写真を選択してください。</p><div id="preview" class="preview"></div></div>
        <div class="actions"><button id="saveButton" class="button gold" type="submit">この記事を公開して保存</button><button id="draftButton" class="button secondary" type="button">下書きで保存</button><button id="privateButton" class="button secondary" type="button">非公開で保存</button><button id="clearButton" class="button secondary" type="button">入力をクリア</button></div>
      </form>
    </div>
    <a class="site-link" href="https://ichirohns-jpg.github.io/kakinuma-takashi-dx/" target="_blank" rel="noopener">公開ページを開く</a>
  </main>
  <footer class="footer">柿沼貴志｜活動報告更新</footer>
  <iframe id="gasBridge" class="bridge" title="GAS接続"></iframe>
  <script>
  (function(){
    'use strict';
    var GAS_URL='https://script.google.com/macros/s/AKfycbwg6TXW4gaquwrkoPxYtJhoFCs4BPykoyZcLinNKljwtfLQD5G1M6EfTAgmhxBVsZa5/exec';
    var SITE_KEY='kakinuma-takashi-dx';
    var MAX_IMAGES=6;
    var token='';
    var savedImages=[];
    var newImages=[];
    var saving=false;
    var bridge=document.getElementById('gasBridge');
    var bridgeReady=false;
    var queue=[];
    var calls={};
    var sequence=0;

    function $(id){return document.getElementById(id)}
    function showStatus(message,type){$('status').textContent=message||'';$('status').className='status show '+(type||'')}
    function password(){return $('password').value.trim()}
    function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
    function normalizeUrl(value){return String(value||'').trim().replace(/\s+/g,'')}
    function youtubeId(value){var m=normalizeUrl(value).match(/(?:[?&]v=|youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|shorts\/|live\/|embed\/|v\/))([A-Za-z0-9_-]{6,})/i);return m?m[1].split(/[?&#/]/)[0]:''}

    function bridgeWindows(){
      var list=[];
      try{
        if(bridge.contentWindow)list.push(bridge.contentWindow);
        for(var i=0;i<bridge.contentWindow.frames.length;i++)list.push(bridge.contentWindow.frames[i]);
      }catch(error){}
      return list;
    }

    function bridgeSend(){
      if(!bridgeReady||!queue.length)return;
      var target=bridgeWindows().pop();
      if(!target)return;
      while(queue.length){
        var item=queue.shift();
        target.postMessage({type:'kakinuma-admin-call',id:item.id,name:item.name,args:item.args||[]},'*');
      }
    }

    function bridgeCall(name,args){
      return new Promise(function(resolve,reject){
        var id='call-'+Date.now()+'-'+(++sequence);
        calls[id]={resolve:resolve,reject:reject};
        queue.push({id:id,name:name,args:args||[]});
        bridgeSend();
        setTimeout(function(){
          if(!calls[id])return;
          delete calls[id];
          reject(new Error('GASとの接続がタイムアウトしました。'));
        },60000);
      });
    }

    window.addEventListener('message',function(event){
      var data=event.data||{};
      if(bridgeWindows().indexOf(event.source)<0)return;
      if(data.type==='kakinuma-admin-ready'){
        bridgeReady=true;
        bridgeSend();
        return;
      }
      if(data.type!=='kakinuma-admin-result')return;
      var call=calls[data.id];
      if(!call)return;
      delete calls[data.id];
      if(data.ok)call.resolve(data.result);
      else call.reject(new Error(data.message||'GAS処理に失敗しました。'));
    });

    bridge.src=GAS_URL+'?page=post&bridge=1';

    function previewYoutube(){var box=$('youtubePreview'),id=youtubeId($('youtubeUrl').value);box.innerHTML='';if(!id){box.classList.remove('open');return}var frame=document.createElement('iframe');frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=0';frame.title='YouTube動画プレビュー';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;box.appendChild(frame);box.classList.add('open')}
    function readImage(file){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){var image=new Image();image.onload=function(){var max=1500,scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82))};image.onerror=reject;image.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
    function addPhoto(src,label,index,type){var figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption'),remove=document.createElement('button');image.src=src;image.alt=label;caption.textContent=label;remove.type='button';remove.className='preview-remove';remove.textContent='この写真を外す';remove.onclick=function(){if(type==='saved')savedImages.splice(index,1);else newImages.splice(index,1);renderPhotos()};figure.appendChild(image);figure.appendChild(caption);figure.appendChild(remove);$('preview').appendChild(figure)}
    function renderPhotos(){$('preview').innerHTML='';savedImages.forEach(function(src,index){addPhoto(src,'保存済み写真'+(index+1),index,'saved')});newImages.forEach(function(src,index){addPhoto(src,'新しく選んだ写真'+(index+1),index,'new')});var count=savedImages.length+newImages.length;$('photoCount').textContent=count?count+'枚選択中です。':'写真を選択してください。'}
    function resetEditor(){$('articleId').value='';$('requestId').value='';$('publishDate').value=today();$('title').value='';$('body').value='';$('youtubeUrl').value='';$('publicUrl').value='https://ichirohns-jpg.github.io/kakinuma-takashi-dx/';$('sortOrder').value='0';$('ogpImage').value='';$('note').value='';$('statusSelect').value='下書き';$('imageFiles').value='';savedImages=[];newImages=[];$('editorTitle').textContent='新しい活動報告';renderPhotos();previewYoutube()}
    function collect(status){return{articleId:$('articleId').value.trim(),siteKey:SITE_KEY,requestId:$('requestId').value.trim(),publishDate:$('publishDate').value,title:$('title').value.trim(),body:$('body').value.trim(),images:savedImages.concat(newImages).slice(0,MAX_IMAGES),youtubeUrl:normalizeUrl($('youtubeUrl').value),status:status,publicUrl:$('publicUrl').value.trim(),sortOrder:$('sortOrder').value.trim(),ogpImage:$('ogpImage').value.trim(),note:$('note').value.trim()}}
    function save(status){if(saving)return;if(!$('title').value.trim()||!$('body').value.trim()){showStatus('タイトルと本文を入力してください。','error');return}saving=true;$('saveButton').disabled=true;showStatus('保存しています。','loading');bridgeCall('postArticleSave',[token,collect(status)]).then(function(result){saving=false;$('saveButton').disabled=false;if(!result||!result.ok){showStatus(result&&result.message||'保存に失敗しました。','error');return}$('articleId').value=result.articleId||'';showStatus(result.message||'保存しました。','ok');loadArticles()}).catch(function(error){saving=false;$('saveButton').disabled=false;showStatus(error.message,'error')})}
    function loadArticles(){showStatus('記事一覧を読み込んでいます。','loading');bridgeCall('postArticleList',[token,SITE_KEY]).then(function(result){if(!result||!result.ok){showStatus(result&&result.message||'記事一覧を読み込めません。','error');return}renderArticles(result.articles||[]);$('operationArea').classList.remove('hidden');showStatus('記事一覧を読み込みました。','ok')}).catch(function(error){showStatus(error.message,'error')})}
    function renderArticles(items){var box=$('articleList');box.innerHTML='';if(!items.length){box.innerHTML='<p class="help">記事はまだありません。</p>';return}items.filter(function(item){return!item.siteKey||item.siteKey===SITE_KEY}).forEach(function(item){var row=document.createElement('article'),title=document.createElement('strong'),meta=document.createElement('small'),body=document.createElement('p'),actions=document.createElement('div'),edit=document.createElement('button'),hide=document.createElement('button');row.className='article-item';title.textContent=item.title||item.articleTitle||'無題';meta.textContent=(item.publishDate||item.date||'')+'｜'+(item.status||'');body.textContent=item.body||item.articleBody||'';actions.className='actions';edit.className='button secondary';edit.type='button';edit.textContent='編集';edit.onclick=function(){editArticle(item)};hide.className='button danger';hide.type='button';hide.textContent='非公開';hide.onclick=function(){hideArticle(item)};actions.appendChild(edit);actions.appendChild(hide);row.appendChild(title);row.appendChild(meta);row.appendChild(body);row.appendChild(actions);box.appendChild(row)})}
    function editArticle(item){$('articleId').value=item.articleId||item.id||'';$('requestId').value=item.requestId||'';$('publishDate').value=item.publishDate||item.date||'';$('title').value=item.title||item.articleTitle||'';$('body').value=item.body||item.articleBody||'';$('youtubeUrl').value=normalizeUrl(item.youtubeUrl||item.youtubeURL||item.videoUrl||item.youtube||'');$('statusSelect').value=item.status||'下書き';$('publicUrl').value=item.publicUrl||'https://ichirohns-jpg.github.io/kakinuma-takashi-dx/';$('sortOrder').value=item.sortOrder||'0';$('ogpImage').value=item.ogpImage||'';$('note').value=item.note||'';savedImages=(item.images||[]).filter(Boolean).slice(0,MAX_IMAGES);newImages=[];$('imageFiles').value='';$('editorTitle').textContent='活動報告を編集';renderPhotos();previewYoutube();$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
    function hideArticle(item){var id=item.articleId||item.id||'';if(!id)return;if(!window.confirm('この記事を非公開にしますか？'))return;showStatus('非公開にしています。','loading');bridgeCall('postArticleHide',[token,id]).then(function(result){if(!result||!result.ok){showStatus(result&&result.message||'非公開に失敗しました。','error');return}showStatus(result.message||'非公開にしました。','ok');loadArticles()}).catch(function(error){showStatus(error.message,'error')})}
    function login(){if(!password()){showStatus('管理パスワードを入力してください。','error');return}var button=$('loginButton');button.disabled=true;button.textContent='認証中…';showStatus('GASに接続しています。','loading');bridgeCall('adminLogin',[password()]).then(function(result){button.disabled=false;if(!result||!result.ok){button.textContent='ログインして記事一覧を読み込む';showStatus(result&&result.message||'ログインできません。','error');return}token=result.token||'';$('password').readOnly=true;button.textContent='認証済み';$('operationArea').classList.remove('hidden');resetEditor();loadArticles()}).catch(function(error){button.disabled=false;button.textContent='ログインして記事一覧を読み込む';showStatus(error.message,'error')})}
    $('imageFiles').onchange=function(){var available=MAX_IMAGES-savedImages.length,files=Array.from(this.files||[]).slice(0,Math.max(0,available));if((this.files||[]).length>available)showStatus('写真は合計6枚までです。保存済み写真を外してから追加してください。','error');newImages=[];Promise.all(files.map(readImage)).then(function(data){newImages=data;renderPhotos()}).catch(function(){showStatus('写真を読み込めませんでした。','error')})};
    $('youtubeUrl').oninput=previewYoutube;
    $('pasteYoutube').onclick=function(){if(!navigator.clipboard||!navigator.clipboard.readText){$('youtubeUrl').focus();showStatus('入力欄を長押しして「ペースト」を選んでください。','ok');return}navigator.clipboard.readText().then(function(value){$('youtubeUrl').value=normalizeUrl(value);previewYoutube();showStatus('YouTubeリンクを貼り付けました。','ok')}).catch(function(){$('youtubeUrl').focus();showStatus('入力欄を長押しして「ペースト」を選んでください。','ok')})};
    $('loginButton').onclick=login;$('password').onkeydown=function(event){if(event.key==='Enter')login()};$('newButton').onclick=function(){if(window.confirm('入力内容を消して新しい記事にしますか？'))resetEditor()};$('clearButton').onclick=function(){if(window.confirm('入力内容をクリアしますか？'))resetEditor()};$('draftButton').onclick=function(){save('下書き')};$('privateButton').onclick=function(){save('非公開')};$('editor').onsubmit=function(event){event.preventDefault();save('公開')};
    resetEditor();
  }());
  </script>
</body>
</html>
