<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b4c">
  <title>柿沼貴志｜活動報告更新</title>
  <style>
    :root{--g:#0b6b4c;--d:#073f2d;--m:#e7f6eb;--gold:#e8b84f;--ink:#1c3026;--muted:#66776c;--line:#d6e8da;--danger:#b42318;--paper:#f7fbf7}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:17px;line-height:1.7}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    .top{padding:20px 16px;background:linear-gradient(135deg,var(--d),var(--g));color:#fff}.inner,main{width:min(100% - 24px,820px);margin:auto}.top h1{margin:0;font-size:clamp(25px,7vw,38px);line-height:1.3}.top p{margin:5px 0 0;color:#ddf1e2}main{padding:14px 0 50px}
    .card{margin:14px 0;padding:20px 16px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 24px #073f2d12}.card h2{margin:0 0 14px;color:var(--d);font-size:24px}.field{margin-bottom:16px}.field:last-child{margin-bottom:0}label{display:block;margin-bottom:6px;font-weight:900}
    input,select,textarea{width:100%;border:1px solid #cbded0;border-radius:11px;background:#fff;color:var(--ink);font-size:17px}input,select{min-height:50px;padding:9px 11px}textarea{min-height:170px;padding:10px 11px;resize:vertical}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 4px #0b6b4c1c}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.paste-row{display:flex;gap:8px;align-items:stretch}.paste-row input{flex:1;min-width:0}.paste-button{min-width:145px;padding:8px 12px;border:1px solid var(--g);border-radius:11px;background:var(--m);color:var(--g);font-weight:900}
    .video-preview{display:none;position:relative;width:100%;margin-top:12px;padding-top:56.25%;overflow:hidden;border-radius:13px;background:#001c14}.video-preview.open{display:block}.video-preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.button{min-height:50px;padding:9px 15px;border:1px solid var(--g);border-radius:999px;background:var(--g);color:#fff;font-weight:900}.button.secondary{background:#fff;color:var(--g)}.button.gold{border-color:var(--gold);background:var(--gold);color:var(--d)}.button.danger{border-color:var(--danger);background:#fff;color:var(--danger)}
    .status{display:none;margin-top:14px;padding:13px;border-radius:12px;white-space:pre-wrap}.status.show{display:block}.status.ok{background:#e8f7eb;color:#21613d}.status.error{background:#fff0f0;color:#8d2727}.status.loading{background:#edf5ff;color:#28547f}.hidden{display:none!important}
    .article-list{display:grid;gap:10px}.article-item{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fbfefb}.article-item strong{display:block;color:var(--d);font-size:18px;line-height:1.45}.article-item small{display:block;margin-top:3px;color:var(--muted)}.article-item p{margin:7px 0 0;color:#385344;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.preview figure{width:140px;margin:0;overflow:hidden;border-radius:10px;background:var(--m)}.preview img{width:140px;height:105px;object-fit:contain;background:#eef8f0}.preview figcaption{padding:3px;color:var(--muted);font-size:11px;text-align:center}.preview-remove{width:100%;min-height:38px;padding:5px 6px;border:1px solid var(--danger);border-radius:9px;background:#fff;color:var(--danger);font-size:13px;font-weight:900}.help{margin:5px 0;color:var(--muted);font-size:13px}.count{margin:6px 0;color:var(--muted);text-align:center}.site-link{display:inline-block;margin-top:10px;color:var(--g);font-weight:900}.footer{padding:24px;color:var(--muted);font-size:13px;text-align:center}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.button{width:100%;min-height:54px}.paste-row{display:grid;grid-template-columns:1fr}.paste-button{width:100%;min-height:52px}.preview figure{width:calc(50% - 4px)}.preview img{width:100%;height:120px}}
  </style>
</head>
<body>
  <header class="top"><div class="inner"><h1>柿沼貴志｜活動報告更新</h1><p>記事・写真・YouTubeを管理します。</p></div></header>
  <main>
    <section class="card">
      <h2>管理者ログイン</h2>
      <div class="field"><label for="password">管理パスワード</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password"></div>
      <div class="actions"><button id="load" class="button" type="button">ログインして記事一覧を読み込む</button></div>
      <div id="status" class="status"></div>
    </section>

    <div id="operationArea" class="hidden">
      <section class="card">
        <h2>保存済みの記事</h2>
        <div class="actions"><button id="new" class="button secondary" type="button">新しい記事を書く</button></div>
        <div id="list" class="article-list"><p class="help">「記事一覧を読み込む」を押してください。</p></div>
      </section>

      <form id="editor" class="card">
        <h2 id="editorTitle">新しい活動報告</h2>
        <input id="newsId" type="hidden"><input id="requestId" type="hidden">

        <div class="grid">
          <div class="field"><label for="date">日付</label><input id="date" type="date" required></div>
          <div class="field"><label for="state">公開状態</label><select id="state"><option value="公開">公開</option><option value="下書き">下書き</option><option value="非公開">非公開</option></select></div>
        </div>

        <div class="field"><label for="title">活動報告タイトル</label><input id="title" required></div>
        <div class="field"><label for="body">活動報告本文</label><textarea id="body" required></textarea></div>

        <div class="field">
          <label for="video">YouTube動画URL（共有からコピーして貼り付け）</label>
          <div class="paste-row">
            <input id="video" type="text" inputmode="url" autocomplete="url" placeholder="YouTubeの共有→リンクをコピー">
            <button id="pasteVideo" class="paste-button" type="button">コピーを貼る</button>
          </div>
          <p class="help">watch、youtu.be、shorts、live、embed形式に対応します。</p>
          <div id="videoPreview" class="video-preview"></div>
        </div>

        <div class="field">
          <label for="external">関連リンク（任意）</label>
          <input id="external" type="url" placeholder="必要な場合だけ入力">
        </div>

        <div class="field">
          <label for="images">活動報告写真（最大6枚）</label>
          <input id="images" type="file" accept="image/*" multiple>
          <p class="help">保存済み写真を「この写真を外す」で外してから、新しい写真を選べます。</p>
          <p id="photoCount" class="count">写真を選択してください。</p>
          <div id="preview" class="preview"></div>
        </div>

        <div class="actions">
          <button id="saveButton" class="button gold" type="submit">この記事を公開して保存</button>
          <button id="draftButton" class="button secondary" type="button">下書きで保存</button>
          <button id="privateButton" class="button secondary" type="button">非公開で保存</button>
          <button id="cancel" class="button secondary" type="button">入力をクリア</button>
        </div>
      </form>
    </div>

    <a class="site-link" href="https://ichirohns-jpg.github.io/kakinuma-takashi-dx/" target="_blank" rel="noopener">公開ページを開く</a>
  </main>

  <footer class="footer">柿沼貴志｜活動報告更新</footer>

  <script>
  (function(){
    "use strict";

    var GAS_URL="https://script.google.com/macros/s/AKfycbwg6TXW4gaquwrkoPxYtJhoFCs4BPykoyZcLinNKljwtfLQD5G1M6EfTAgmhxBVsZa5/exec";
    var SITE_KEY="kakinuma-takashi-dx";
    var MAX_IMAGES=6;
    var currentImages=[];
    var newImages=[];
    var saving=false;
    var $=function(id){return document.getElementById(id)};

    function status(message,kind){
      $("status").textContent=message||"";
      $("status").className="status show "+(kind||"")
    }

    function password(){
      return $("password").value.trim()
    }

    function normalizeUrl(value){
      return String(value||"").trim().replace(/\s+/g,"")
    }

    function today(){
      var d=new Date();
      return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")
    }

    function toDate(value){
      if(!value)return"";
      if(/^\d{4}-\d{2}-\d{2}$/.test(value))return value;
      var d=new Date(value);
      return isNaN(d.getTime())?String(value):d.toISOString().slice(0,10)
    }

    function itemId(item){
      return String(item&&(item.id||item.newsId||item.ID||"")).trim()
    }

    function itemVideo(item){
      return normalizeUrl(item&&(item.videoUrl||item.videoURL||item.video_url||item.youtubeUrl||item.youtube_url||item.youtubeURL||item.youtube||item.video||""))
    }

    function youtubeId(value){
      var m=normalizeUrl(value).match(/(?:[?&]v=|youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|shorts\/|live\/|embed\/|v\/))([A-Za-z0-9_-]{6,})/i);
      return m?m[1].split(/[?&#/]/)[0]:""
    }

    function api(data){
      return fetch(GAS_URL,{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(data)
      })
      .then(function(response){
        return response.text()
      })
      .then(function(text){
        try{
          return JSON.parse(text)
        }catch(error){
          throw new Error("GASから正しい返答を受け取れませんでした。")
        }
      })
    }

    function previewVideo(){
      var box=$("videoPreview");
      var id=youtubeId($("video").value);
      box.innerHTML="";

      if(!id){
        box.classList.remove("open");
        return
      }

      var frame=document.createElement("iframe");
      frame.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?playsinline=1&rel=0";
      frame.title="YouTube動画プレビュー";
      frame.loading="lazy";
      frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      frame.allowFullscreen=true;
      box.appendChild(frame);
      box.classList.add("open")
    }

    function clearEditor(){
      saving=false;
      $("newsId").value="";
      $("requestId").value="";
      $("date").value=today();
      $("title").value="";
      $("body").value="";
      $("video").value="";
      $("external").value="";
      $("state").value="公開";
      $("images").value="";
      currentImages=[];
      newImages=[];
      $("editorTitle").textContent="新しい活動報告";
      showPreview();
      previewVideo()
    }

    function addPreview(box,src,label,onRemove){
      var f=document.createElement("figure");
      var im=document.createElement("img");
      var cap=document.createElement("figcaption");
      var button=document.createElement("button");

      im.src=src;
      im.alt=label;
      cap.textContent=label;

      button.type="button";
      button.className="preview-remove";
      button.textContent="この写真を外す";
      button.onclick=onRemove;

      f.appendChild(im);
      f.appendChild(cap);
      f.appendChild(button);
      box.appendChild(f)
    }

    function showPreview(){
      var box=$("preview");
      box.innerHTML="";

      currentImages.forEach(function(src,i){
        addPreview(box,src,"保存済み写真"+(i+1),function(){
          currentImages.splice(i,1);
          showPreview()
        })
      });

      newImages.forEach(function(item,i){
        addPreview(box,item.data,"新しく選んだ写真"+(i+1),function(){
          newImages.splice(i,1);
          showPreview()
        })
      });

      var count=currentImages.length+newImages.length;
      $("photoCount").textContent=count?count+"枚選択中です。":"写真を選択してください。"
    }

    function readImage(file){
      return new Promise(function(resolve,reject){
        var reader=new FileReader();

        reader.onload=function(){
          var image=new Image();

          image.onload=function(){
            var max=1500;
            var scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));
            var canvas=document.createElement("canvas");

            canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
            canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));

            canvas.getContext("2d").drawImage(
              image,
              0,
              0,
              canvas.width,
              canvas.height
            );

            resolve(canvas.toDataURL("image/jpeg",.82))
          };

          image.onerror=reject;
          image.src=reader.result
        };

        reader.onerror=reject;
        reader.readAsDataURL(file)
      })
    }

    function render(items){
      var box=$("list");
      box.innerHTML="";

      var filtered=(items||[]).filter(function(item){
        return !item.siteKey||item.siteKey===SITE_KEY
      });

      if(!filtered.length){
        box.innerHTML='<p class="help">記事はまだありません。</p>';
        return
      }

      filtered.forEach(function(item){
        var row=document.createElement("article");
        var title=document.createElement("strong");
        var meta=document.createElement("small");
        var body=document.createElement("p");
        var actions=document.createElement("div");
        var editButton=document.createElement("button");
        var privateButton=document.createElement("button");

        row.className="article-item";
        title.textContent=item.title||"無題";
        meta.textContent=(item.date||"")+"｜"+(item.status||"");
        body.textContent=item.body||"";
        actions.className="actions";

        editButton.className="button secondary";
        editButton.type="button";
        editButton.textContent="編集";
        editButton.onclick=function(){
          edit(item)
        };

        privateButton.className="button danger";
        privateButton.type="button";
        privateButton.textContent="非公開";
        privateButton.onclick=function(){
          makePrivate(item)
        };

        actions.appendChild(editButton);

        if(item.status!=="非公開"){
          actions.appendChild(privateButton)
        }

        row.appendChild(title);
        row.appendChild(meta);
        row.appendChild(body);
        row.appendChild(actions);
        box.appendChild(row)
      })
    }

    function loadList(){
      if(!password()){
        status("管理パスワードを入力してください。","error");
        return
      }

      status("記事一覧を読み込んでいます。","loading");

      api({
        mode:"adminNewsList",
        adminPassword:password(),
        siteKey:SITE_KEY
      })
      .then(function(data){
        if(!data||data.success!==true||!Array.isArray(data.news)){
          throw new Error((data&&data.message)||"読み込みに失敗しました。")
        }

        render(data.news);
        $("operationArea").classList.remove("hidden");
        $("password").readOnly=true;
        $("load").textContent="認証済み";
        status("認証しました。記事一覧を表示しました。","ok")
      })
      .catch(function(error){
        status(error.message,"error")
      })
    }

    function edit(item){
      var id=itemId(item);

      if(!id){
        status("この記事のIDを取得できないため編集できません。","error");
        return
      }

      $("newsId").value=id;
      $("requestId").value=item.requestId||"";
      $("date").value=toDate(item.date);
      $("title").value=item.title||"";
      $("body").value=item.body||"";
      $("video").value=itemVideo(item);
      $("external").value=youtubeId(item.externalUrl||"")?"":item.externalUrl||"";
      $("state").value=item.status||"公開";
      currentImages=(item.images||[]).filter(Boolean).slice(0,MAX_IMAGES);
      newImages=[];
      $("images").value="";
      $("editorTitle").textContent="活動報告を編集";
      showPreview();
      previewVideo();

      $("editor").scrollIntoView({
        behavior:"smooth",
        block:"start"
      })
    }

    function save(statusValue){
      if(saving)return;

      if(!password()){
        status("管理パスワードを入力してください。","error");
        return
      }

      if(!$("title").value.trim()||!$("body").value.trim()){
        status("タイトルと本文を入力してください。","error");
        return
      }

      saving=true;
      $("saveButton").disabled=true;
      status("保存しています。","loading");

      var youtube=normalizeUrl($("video").value);
      var external=normalizeUrl($("external").value);

      if(!youtube&&youtubeId(external)){
        youtube=external;
        external=""
      }

      if(youtubeId(external)){
        external=""
      }

      var payload={
        mode:"adminNewsSave",
        adminPassword:password(),
        siteKey:SITE_KEY,
        newsId:$("newsId").value,
        requestId:$("requestId").value||("NEWS-"+Date.now()+"-"+Math.random().toString(36).slice(2)),
        date:$("date").value,
        title:$("title").value.trim(),
        body:$("body").value.trim(),
        videoUrl:youtube,
        videoURL:youtube,
        video_url:youtube,
        youtubeUrl:youtube,
        youtube_url:youtube,
        youtubeURL:youtube,
        youtube:youtube,
        video:youtube,
        externalUrl:external,
        status:statusValue,
        existingImages:currentImages,
        newImages:newImages.map(function(item,i){
          return{
            data:item.data,
            name:"activity-"+(i+1)+".jpg",
            mimeType:"image/jpeg"
          }
        })
      };

      api(payload)
      .then(function(data){
        if(!data||data.success!==true){
          throw new Error((data&&data.message)||"保存に失敗しました。")
        }

        clearEditor();
        status("保存しました。","ok");
        loadList()
      })
      .catch(function(error){
        saving=false;
        $("saveButton").disabled=false;
        status(error.message,"error")
      })
    }

    function makePrivate(item){
      var id=itemId(item);

      if(!id){
        status("この記事のIDを取得できません。","error");
        return
      }

      if(!window.confirm("この記事を非公開にしますか？"))return;

      status("非公開にしています。","loading");

      api({
        mode:"adminNewsSave",
        adminPassword:password(),
        siteKey:SITE_KEY,
        newsId:id,
        requestId:item.requestId||("NEWS-"+Date.now()),
        date:toDate(item.date),
        title:item.title||"",
        body:item.body||"",
        videoUrl:itemVideo(item),
        youtubeUrl:itemVideo(item),
        externalUrl:item.externalUrl||"",
        status:"非公開",
        existingImages:(item.images||[]).filter(Boolean).slice(0,MAX_IMAGES),
        newImages:[]
      })
      .then(function(data){
        if(!data||data.success!==true){
          throw new Error((data&&data.message)||"非公開に失敗しました。")
        }

        status("非公開にしました。","ok");
        loadList()
      })
      .catch(function(error){
        status(error.message,"error")
      })
    }

    $("images").onchange=function(){
      var files=Array.from($("images").files||[]);
      var available=Math.max(0,MAX_IMAGES-currentImages.length);

      if(files.length>available){
        status("写真は合計6枚までです。保存済み写真を外してから追加してください。","error");
        files=files.slice(0,available)
      }

      newImages=[];

      Promise.all(files.map(readImage))
      .then(function(list){
        newImages=list.map(function(data){
          return{data:data}
        });

        showPreview()
      })
      .catch(function(){
        status("写真を読み込めませんでした。","error")
      })
    };

    $("video").oninput=previewVideo;

    $("pasteVideo").onclick=function(){
      if(!navigator.clipboard||!navigator.clipboard.readText){
        $("video").focus();
        status("入力欄を長押しして「ペースト」を選んでください。","ok");
        return
      }

      navigator.clipboard.readText()
      .then(function(value){
        $("video").value=normalizeUrl(value);
        previewVideo();
        status("YouTubeリンクを貼り付けました。","ok")
      })
      .catch(function(){
        $("video").focus();
        status("入力欄を長押しして「ペースト」を選んでください。","ok")
      })
    };

    $("load").onclick=loadList;

    $("new").onclick=function(){
      clearEditor()
    };

    $("cancel").onclick=function(){
      if(window.confirm("入力内容をクリアしますか？")){
        clearEditor()
      }
    };

    $("draftButton").onclick=function(){
      save("下書き")
    };

    $("privateButton").onclick=function(){
      save("非公開")
    };

    $("editor").onsubmit=function(event){
      event.preventDefault();
      save("公開")
    };

    $("password").onkeydown=function(event){
      if(event.key==="Enter"){
        loadList()
      }
    };

    clearEditor();
  }());
  </script>
</body>
</html>
