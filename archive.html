<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#263b52">
  <meta name="description" content="柿沼貴志議員の活動報告一覧">
  <meta property="og:title" content="活動報告一覧｜柿沼貴志議員">
  <meta property="og:description" content="柿沼貴志議員の活動報告を新しい順にご覧いただけます。">
  <meta property="og:image" content="https://ichirohns-jpg.github.io/kakinuma-takashi-dx/profile_photo_3.jpg">
  <link rel="manifest" href="manifest.json">
  <title>活動報告一覧｜柿沼貴志議員</title>

  <style>
    :root{
      --navy:#263b52;
      --navy-deep:#1b2b3c;
      --orange:#d8792b;
      --cream:#f5f1ea;
      --paper:#fffdf9;
      --text:#29313a;
      --muted:#68727c;
      --line:#ddd7ce;
      --shadow:0 8px 26px rgba(35,48,61,.10);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--cream);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,
      "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      font-size:17px;
      line-height:1.85;
      overflow-x:hidden;
    }

    img{display:block;max-width:100%}
    a{color:inherit;-webkit-tap-highlight-color:transparent}
    .hidden{display:none!important}

    .site-header{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(255,253,249,.96);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(10px);
    }

    .header-inner{
      width:min(100% - 28px,900px);
      margin:auto;
      padding:12px 0 10px;
    }

    .header-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .site-name{
      color:var(--navy-deep);
      font-size:20px;
      font-weight:900;
      line-height:1.25;
      text-decoration:none;
      letter-spacing:.04em;
    }

    .site-name small{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-family:Georgia,serif;
      font-size:10px;
      letter-spacing:.14em;
    }

    .top-link{
      padding:8px 13px;
      border:1px solid var(--navy);
      border-radius:999px;
      color:var(--navy);
      font-size:13px;
      font-weight:900;
      text-decoration:none;
      white-space:nowrap;
    }

    main{
      width:min(100% - 28px,900px);
      margin:auto;
      padding:24px 0 60px;
    }

    .page-heading{
      padding:clamp(24px,5vw,46px);
      border-radius:22px;
      background:var(--paper);
      box-shadow:var(--shadow);
    }

    .kicker{
      margin:0 0 10px;
      color:var(--orange);
      font-size:14px;
      font-weight:900;
      letter-spacing:.08em;
    }

    h1{
      margin:0;
      color:var(--navy-deep);
      font-size:clamp(30px,6vw,50px);
      line-height:1.4;
    }

    .lead{
      margin:16px 0 0;
      color:var(--muted);
      font-size:16px;
    }

    .tools{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:24px;
    }

    .search{
      min-width:0;
      flex:1;
      padding:13px 15px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--paper);
      color:var(--text);
      font:inherit;
      font-size:16px;
      outline:none;
    }

    .search:focus{
      border-color:var(--navy);
      box-shadow:0 0 0 3px rgba(38,59,82,.12);
    }

    .count{
      color:var(--muted);
      font-size:14px;
      white-space:nowrap;
    }

    .message{
      margin-top:18px;
      padding:22px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--paper);
      color:var(--muted);
      text-align:center;
    }

    .message.error{
      color:#9c382c;
    }

    .article-list{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:20px;
      margin-top:18px;
    }

    .article-card{
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:17px;
      background:var(--paper);
      box-shadow:var(--shadow);
    }

    .article-image{
      width:100%;
      aspect-ratio:16/10;
      object-fit:cover;
      background:#ebe6de;
    }

    .article-content{
      padding:20px;
    }

    .article-date{
      margin:0 0 5px;
      color:var(--orange);
      font-size:13px;
      font-weight:900;
    }

    .article-title{
      margin:0 0 10px;
      color:var(--navy-deep);
      font-size:22px;
      line-height:1.5;
    }

    .article-summary{
      display:-webkit-box;
      margin:0;
      overflow:hidden;
      color:var(--muted);
      font-size:15px;
      line-height:1.85;
      white-space:pre-line;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:4;
    }

    .read-link{
      display:block;
      margin-top:16px;
      padding:11px;
      border-radius:10px;
      background:var(--navy);
      color:#fff;
      font-size:14px;
      font-weight:900;
      text-align:center;
      text-decoration:none;
    }

    .back-link{
      display:block;
      width:max-content;
      margin:28px auto 0;
      padding:12px 20px;
      border:1px solid var(--navy);
      border-radius:999px;
      color:var(--navy);
      font-weight:900;
      text-decoration:none;
    }

    footer{
      padding:0 20px 34px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }

    @media(max-width:620px){
      body{font-size:16px}
      .header-inner{width:min(100% - 22px,900px)}
      .top-link{padding:7px 10px;font-size:12px}
      main{width:min(100% - 20px,900px);padding-top:14px}
      .page-heading{border-radius:17px;padding:26px 20px}
      h1{font-size:31px}
      .tools{align-items:stretch;flex-direction:column;gap:7px}
      .count{padding-left:2px}
      .article-list{grid-template-columns:1fr}
      .article-content{padding:18px}
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-top">
        <a class="site-name" href="index.html">
          柿沼 貴志
          <small>TAKASHI KAKINUMA OFFICIAL INFORMATION</small>
        </a>

        <a class="top-link" href="index.html">
          トップへ戻る
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-heading">
      <p class="kicker">柿沼貴志議員｜活動報告</p>
      <h1>活動報告一覧</h1>
      <p class="lead">
        日々の活動や地域での取り組みを、新しい順にご紹介します。
      </p>
    </section>

    <div class="tools">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="活動報告を検索"
        aria-label="活動報告を検索"
      >
      <span id="count" class="count"></span>
    </div>

    <div id="loading" class="message">
      活動報告を読み込んでいます。
    </div>

    <div id="error" class="message error hidden"></div>

    <div id="empty" class="message hidden">
      公開中の活動報告はありません。
    </div>

    <section id="articleList" class="article-list" aria-live="polite"></section>

    <a class="back-link" href="index.html">
      トップページへ戻る
    </a>
  </main>

  <footer>
    柿沼貴志 活動報告DX
  </footer>

  <script>
    (function(){
      'use strict';

      var GAS_URL='https://script.google.com/macros/s/AKfycby4VxnadXWsXtn27EcABG-TEVP3b5oKUsKxoGzhztNolL6LojXTyb5h3-VXaIJRC7Xx/exec';
      var SITE_KEY='kakinuma-takashi-dx';

      var list=document.getElementById('articleList');
      var loading=document.getElementById('loading');
      var errorBox=document.getElementById('error');
      var empty=document.getElementById('empty');
      var search=document.getElementById('search');
      var count=document.getElementById('count');

      var articles=[];

      function escapeHtml(value){
        return String(value||'').replace(/[&<>"']/g,function(ch){
          return {
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
          }[ch];
        });
      }

      function plainText(value){
        var source=String(value||'')
          .replace(/<br\s*\/?>/gi,'\n')
          .replace(/<\/p\s*>/gi,'\n\n');

        var box=document.createElement('div');
        box.innerHTML=source;

        return (box.textContent||box.innerText||'')
          .replace(/\r\n/g,'\n')
          .replace(/\r/g,'\n')
          .replace(/[ \t]+/g,' ')
          .replace(/\n{3,}/g,'\n\n')
          .trim();
      }

      function first(obj,keys){
        for(var i=0;i<keys.length;i++){
          var key=keys[i];

          if(
            obj &&
            obj[key]!==undefined &&
            obj[key]!==null &&
            String(obj[key]).trim()!==''
          ){
            return obj[key];
          }
        }

        return '';
      }

      function safeUrl(value){
        var url=String(value||'').trim();
        return /^https:\/\//i.test(url)?url:'';
      }

      function youtubeId(value){
        var match=String(value||'').match(
          /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([A-Za-z0-9_-]{6,})/i
        );

        return match?match[1]:'';
      }

      function youtubeImage(value){
        var id=youtubeId(value);

        return id
          ? 'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'
          : '';
      }

      function normalize(row){
        var images=[];

        if(Array.isArray(row&&row.images)){
          images=images.concat(row.images);
        }

        for(var i=1;i<=6;i++){
          images.push(first(row,[
            'image'+i,
            '画像'+i,
            'photo'+i
          ]));
        }

        return {
          id:String(first(row,[
            'articleId',
            'id',
            '記事ID'
          ])||'').trim(),

          title:String(first(row,[
            'title',
            'articleTitle',
            '記事タイトル'
          ])||'活動報告').trim(),

          date:String(first(row,[
            'publishDate',
            'date',
            '公開日',
            'createdAt',
            '作成日'
          ])||'').trim(),

          body:String(first(row,[
            'body',
            'articleBody',
            '本文',
            '記事本文'
          ])||'').trim(),

          youtube:String(first(row,[
            'youtubeUrl',
            'youtubeURL',
            'YouTube',
            '動画URL',
            'videoUrl'
          ])||'').trim(),

          status:String(first(row,[
            'publicStatus',
            'status',
            '公開状態'
          ])||'').trim(),

          images:images
            .map(safeUrl)
            .filter(Boolean)
            .filter(function(value,index,array){
              return array.indexOf(value)===index;
            })
        };
      }

      function isVisible(article){
        var status=article.status.toLowerCase();

        return !status ||
          (
            !status.includes('非公開') &&
            !status.includes('下書き') &&
            status!=='false' &&
            status!=='0'
          );
      }

      function dateNumber(value){
        var text=String(value||'')
          .replace(/年|月/g,'/')
          .replace(/日/g,'');

        var time=Date.parse(text);

        return Number.isNaN(time)?0:time;
      }

      function summary(value){
        var text=plainText(value);
        var paragraphs=text.split(/\n\s*\n/).filter(Boolean);
        var result=paragraphs.slice(0,2).join('\n\n');

        if(result.length>155){
          result=result.slice(0,155)+'…';
        }

        return result;
      }

      function articleLink(article){
        return 'article.html?id='+
          encodeURIComponent(article.id)+
          '&site='+
          encodeURIComponent(SITE_KEY);
      }

      function render(){
        var keyword=search.value.trim().toLowerCase();

        var filtered=articles.filter(function(article){
          if(!keyword){
            return true;
          }

          return (
            article.title+' '+plainText(article.body)
          ).toLowerCase().includes(keyword);
        });

        count.textContent=filtered.length+'件';
        list.innerHTML='';
        empty.classList.toggle('hidden',filtered.length!==0);

        filtered.forEach(function(article){
          var image=article.images[0]||youtubeImage(article.youtube);
          var body=summary(article.body);
          var card=document.createElement('article');

          card.className='article-card';

          card.innerHTML=
            (
              image
                ? '<img class="article-image" src="'+
                  escapeHtml(image)+
                  '" alt="'+
                  escapeHtml(article.title)+
                  '" loading="lazy">'
                : ''
            )+
            '<div class="article-content">'+
            '<p class="article-date">'+
            escapeHtml(article.date||'公開記事')+
            '</p>'+
            '<h2 class="article-title">'+
            escapeHtml(article.title)+
            '</h2>'+
            (
              body
                ? '<p class="article-summary">'+
                  escapeHtml(body)+
                  '</p>'
                : ''
            )+
            '<a class="read-link" href="'+
            escapeHtml(articleLink(article))+
            '">この記事を読む</a>'+
            '</div>';

          var imageElement=card.querySelector('img');

          if(imageElement){
            imageElement.addEventListener(
              'error',
              function(){
                imageElement.remove();
              },
              {once:true}
            );
          }

          list.appendChild(card);
        });
      }

      fetch(
        GAS_URL+
        '?action=publicArticles&siteKey='+
        encodeURIComponent(SITE_KEY)+
        '&_='+
        Date.now(),
        {cache:'no-store'}
      )
      .then(function(response){
        if(!response.ok){
          throw new Error('記事データを取得できません。');
        }

        return response.json();
      })
      .then(function(data){
        var rows=
          data&&Array.isArray(data.articles)
            ? data.articles
            : [];

        articles=rows
          .map(normalize)
          .filter(function(article){
            return article.id&&isVisible(article);
          });

        articles.sort(function(a,b){
          return dateNumber(b.date)-dateNumber(a.date);
        });

        loading.classList.add('hidden');
        render();
      })
      .catch(function(){
        loading.classList.add('hidden');

        errorBox.textContent=
          '活動報告を読み込めませんでした。時間をおいて再度お試しください。';

        errorBox.classList.remove('hidden');
      });

      search.addEventListener('input',render);
    })();
  </script>
</body>
</html>
