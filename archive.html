<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f4058">
  <meta name="description" content="柿沼貴志議員の活動報告一覧です。">
  <meta property="og:title" content="活動報告一覧｜柿沼貴志">
  <meta property="og:description" content="柿沼貴志議員の活動報告を新しい順にご覧いただけます。">
  <meta property="og:image" content="https://ichirohns-jpg.github.io/kakinuma-takashi-dx/profile_photo_3.jpg">
  <link rel="manifest" href="manifest.json">
  <title>活動報告一覧｜柿沼貴志</title>

  <style>
    :root{
      --navy:#1f4058;
      --navy-deep:#142d40;
      --blue-soft:#e8f5fb;
      --green-soft:#edf8f0;
      --cream:#fffaf0;
      --paper:#fff;
      --orange:#c97832;
      --text:#182530;
      --muted:#52616b;
      --line:#b8ccd7;
      --shadow:0 12px 28px rgba(20,45,64,.13);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      padding-bottom:84px;
      background:
        radial-gradient(circle at 0 0,rgba(218,240,248,.7),transparent 28%),
        linear-gradient(180deg,#f9fdff 0%,#fff 60%,#f2faf5 100%);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,
      "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      font-size:19px;
      line-height:1.85;
      -webkit-text-size-adjust:100%;
    }

    *:focus-visible{
      outline:4px solid #efb45b;
      outline-offset:3px;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      display:block;
      max-width:100%;
    }

    .hidden{
      display:none!important;
    }

    .wrap{
      width:min(100% - 24px,940px);
      margin:auto;
    }

    .site-header{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(249,253,255,.97);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(12px);
    }

    .header-inner{
      padding:12px 0 10px;
    }

    .header-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .site-name{
      display:block;
      color:var(--navy-deep);
      font-size:clamp(24px,5vw,34px);
      font-weight:950;
      letter-spacing:.08em;
      line-height:1.15;
    }

    .site-name small{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-family:Georgia,serif;
      font-size:10px;
      letter-spacing:.14em;
    }

    .top-link{
      flex:0 0 auto;
      padding:9px 14px;
      border:2px solid var(--navy);
      border-radius:999px;
      color:var(--navy);
      font-size:15px;
      font-weight:950;
      white-space:nowrap;
    }

    .header-nav{
      display:flex;
      gap:7px;
      margin-top:10px;
      overflow-x:auto;
      scrollbar-width:none;
    }

    .header-nav::-webkit-scrollbar{
      display:none;
    }

    .header-nav a{
      flex:0 0 auto;
      padding:7px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--navy);
      font-size:15px;
      font-weight:950;
    }

    .header-nav a:first-child{
      background:var(--navy);
      color:#fff;
    }

    main{
      padding:18px 0 42px;
    }

    .page-heading{
      padding:26px;
      border:2px solid var(--line);
      border-radius:28px;
      background:var(--paper);
      box-shadow:var(--shadow);
    }

    .kicker{
      margin:0 0 10px;
      color:var(--orange);
      font-size:17px;
      font-weight:950;
      letter-spacing:.08em;
    }

    h1{
      margin:0;
      color:var(--navy-deep);
      font-size:clamp(39px,7vw,59px);
      font-weight:950;
      line-height:1.35;
    }

    .lead{
      margin:15px 0 0;
      color:var(--text);
      font-size:19px;
      font-weight:750;
      line-height:1.8;
    }

    .tools{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:18px;
    }

    .search{
      min-width:0;
      flex:1;
      padding:16px 17px;
      border:2px solid var(--line);
      border-radius:15px;
      background:#fff;
      color:var(--text);
      font:inherit;
      font-size:19px;
      outline:none;
    }

    .search:focus{
      border-color:var(--navy);
      box-shadow:0 0 0 3px rgba(31,64,88,.12);
    }

    .count{
      color:var(--muted);
      font-size:18px;
      font-weight:850;
      white-space:nowrap;
    }

    .message{
      margin-top:18px;
      padding:26px;
      border:2px solid var(--line);
      border-radius:20px;
      background:#fff;
      color:var(--text);
      font-size:19px;
      font-weight:750;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .message.error{
      color:#9b372e;
    }

    .article-list{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:15px;
      margin-top:18px;
    }

    .article-card{
      overflow:hidden;
      border:2px solid #d6e3e9;
      border-radius:21px;
      background:#fff;
      box-shadow:var(--shadow);
    }

    .article-card:first-child{
      grid-column:1 / -1;
      display:grid;
      grid-template-columns:1.1fr .9fr;
    }

    .article-image{
      width:100%;
      height:225px;
      object-fit:cover;
      background:#edf1f3;
    }

    .article-card:first-child .article-image{
      height:100%;
      min-height:280px;
    }

    .article-content{
      padding:18px;
    }

    .article-date{
      margin:0;
      color:var(--orange);
      font-size:16px;
      font-weight:950;
    }

    .article-title{
      margin:5px 0 8px;
      color:var(--navy-deep);
      font-size:25px;
      font-weight:950;
      line-height:1.45;
    }

    .article-card:first-child .article-title{
      font-size:29px;
    }

    .article-summary{
      display:-webkit-box;
      margin:0;
      overflow:hidden;
      color:var(--text);
      font-size:17px;
      font-weight:650;
      line-height:1.8;
      white-space:pre-line;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:5;
    }

    .read-link{
      display:block;
      margin-top:15px;
      padding:13px;
      border-radius:14px;
      background:var(--navy);
      color:#fff;
      font-size:17px;
      font-weight:950;
      text-align:center;
    }

    .back-link{
      display:block;
      width:max-content;
      margin:25px auto 0;
      padding:13px 23px;
      border:2px solid var(--navy);
      border-radius:999px;
      color:var(--navy);
      font-size:17px;
      font-weight:950;
    }

    footer{
      padding:0 20px 25px;
      color:var(--muted);
      font-size:14px;
      font-weight:700;
      text-align:center;
    }

    .bottom-nav{
      position:fixed;
      right:0;
      bottom:0;
      left:0;
      z-index:100;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      border-top:1px solid var(--line);
      background:rgba(255,255,255,.98);
      box-shadow:0 -10px 26px rgba(20,45,64,.14);
      backdrop-filter:blur(12px);
    }

    .bottom-nav a{
      padding:8px 3px 7px;
      color:var(--navy);
      font-size:12px;
      font-weight:950;
      text-align:center;
    }

    .bottom-nav a span{
      display:block;
      font-size:22px;
      line-height:1.1;
    }

    .bottom-nav a.active{
      background:var(--blue-soft);
      color:var(--navy-deep);
    }

    @media(max-width:700px){
      .wrap{
        width:min(100% - 16px,940px);
      }

      .site-name{
        font-size:25px;
      }

      .site-name small{
        font-size:8px;
        letter-spacing:.1em;
      }

      .top-link{
        padding:8px 10px;
        font-size:13px;
      }

      .header-nav a{
        padding:7px 10px;
        font-size:14px;
      }

      main{
        padding-top:10px;
      }

      .page-heading{
        padding:22px 18px;
        border-radius:22px;
      }

      h1{
        font-size:38px;
      }

      .lead{
        font-size:17px;
      }

      .tools{
        align-items:stretch;
        flex-direction:column;
        gap:7px;
      }

      .count{
        padding-left:2px;
      }

      .article-list{
        grid-template-columns:1fr;
      }

      .article-card:first-child{
        display:block;
        grid-column:auto;
      }

      .article-card:first-child .article-image{
        height:235px;
        min-height:0;
      }

      .article-content{
        padding:18px;
      }

      .article-card:first-child .article-title{
        font-size:26px;
      }

      .bottom-nav a{
        font-size:11px;
      }

      .bottom-nav a span{
        font-size:20px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="header-top">
        <a class="site-name" href="index.html">
          柿沼貴志
          <small>TAKASHI KAKINUMA OFFICIAL INFORMATION</small>
        </a>

        <a class="top-link" href="index.html">トップへ戻る</a>
      </div>

      <nav class="header-nav" aria-label="ページメニュー">
        <a href="index.html">HOME</a>
        <a href="archive.html">活動報告</a>
        <a href="index.html#profile">プロフィール</a>
        <a href="index.html#policy">政策</a>
        <a href="index.html#contact">相談</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="page-heading">
      <p class="kicker">柿沼貴志議員｜活動報告</p>
      <h1>活動報告一覧</h1>
      <p class="lead">日々の活動や地域での取り組みを、新しい順にご紹介します。</p>
    </section>

    <div class="tools">
      <input id="search" class="search" type="search" placeholder="活動報告を検索" aria-label="活動報告を検索">
      <span id="count" class="count"></span>
    </div>

    <div id="loading" class="message">活動報告を読み込んでいます。</div>
    <div id="error" class="message error hidden"></div>
    <div id="empty" class="message hidden">公開中の活動報告はありません。</div>

    <section id="articleList" class="article-list" aria-live="polite"></section>

    <a class="back-link" href="index.html">トップページへ戻る</a>
  </main>

  <footer>柿沼貴志 活動報告DX</footer>

  <nav class="bottom-nav" aria-label="固定メニュー">
    <a class="active" href="index.html"><span>🏠</span>トップ</a>
    <a href="archive.html"><span>📸</span>活動</a>
    <a href="index.html#profile"><span>👤</span>人物</a>
    <a href="index.html#policy"><span>🌱</span>政策</a>
    <a href="index.html#contact"><span>💬</span>相談</a>
  </nav>

  <script>
    (function(){
      'use strict';

      var GAS_URL='https://script.google.com/macros/s/AKfycby4VxnadXWsXtn27EcABG-TEVP3b5oKUsKxoGzhztNolL6LojXTyb5h3-VXaIJRC7Xx/exec';
      var SITE_KEY='kakinuma-takashi-dx';

      var list=document.getElementById('articleList');
      var loading=document.getElementById('loading');
      var errorBox=document.getElementById('error');
      var empty=document.getElementById('empty');
      var search=document.getElementById('search');
      var count=document.getElementById('count');
      var articles=[];

      function escapeHtml(value){
        return String(value||'').replace(/[&<>"']/g,function(ch){
          return {
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
          }[ch];
        });
      }

      function plainText(value){
        var source=String(value||'')
          .replace(/<br\s*\/?>/gi,'\n')
          .replace(/<\/p\s*>/gi,'\n\n');

        var box=document.createElement('div');
        box.innerHTML=source;

        return (box.textContent||box.innerText||'')
          .replace(/\r\n/g,'\n')
          .replace(/\r/g,'\n')
          .replace(/[ \t]+/g,' ')
          .replace(/\n{3,}/g,'\n\n')
          .trim();
      }

      function first(obj,keys){
        for(var i=0;i<keys.length;i++){
          var key=keys[i];

          if(
            obj &&
            obj[key]!==undefined &&
            obj[key]!==null &&
            String(obj[key]).trim()!==''
          ){
            return obj[key];
          }
        }

        return '';
      }

      function imageValue(value){
        if(value&&typeof value==='object'){
          return String(
            value.url||
            value.src||
            value.imageUrl||
            value.value||
            ''
          ).trim();
        }

        return String(value||'').trim();
      }

      function driveFileId(value){
        var url=imageValue(value);

        var match=url.match(
          /drive\.google\.com\/file\/d\/([^/?#]+)/i
        );

        if(match){
          return match[1];
        }

        match=url.match(
          /(?:drive\.google\.com|drive\.usercontent\.google\.com)\/[^?#]*[?&]id=([^&#]+)/i
        );

        if(match){
          return match[1];
        }

        match=url.match(
          /lh3\.googleusercontent\.com\/d\/([^=/?#]+)/i
        );

        return match?match[1]:'';
      }

      function safeUrl(value){
        var url=imageValue(value);

        if(!url){
          return '';
        }

        var driveId=driveFileId(url);

        if(driveId){
          return 'https://drive.google.com/thumbnail?id='+
            encodeURIComponent(driveId)+
            '&sz=w1600';
        }

        if(/^data:image\//i.test(url)){
          return url;
        }

        if(/^https?:\/\//i.test(url)){
          return url;
        }

        if(/^(?:\.{0,2}\/|\/)[^\s]+/.test(url)){
          return url;
        }

        return '';
      }

      function youtubeId(value){
        var match=String(value||'').match(
          /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{6,})/i
        );

        return match?match[1]:'';
      }

      function youtubeImage(value){
        var id=youtubeId(value);

        return id
          ? 'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'
          : '';
      }

      function formatDate(value){
        var text=String(value||'').trim();

        if(!text){
          return '';
        }

        var japanese=text.match(
          /^(\d{4})年(\d{1,2})月(\d{1,2})日/
        );

        if(japanese){
          return japanese[1]+'年'+
            Number(japanese[2])+'月'+
            Number(japanese[3])+'日';
        }

        var direct=text.match(
          /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/
        );

        if(direct){
          return direct[1]+'年'+
            Number(direct[2])+'月'+
            Number(direct[3])+'日';
        }

        var date=new Date(text);

        if(isNaN(date.getTime())){
          return text;
        }

        try{
          var parts=new Intl.DateTimeFormat(
            'ja-JP',
            {
              timeZone:'Asia/Tokyo',
              year:'numeric',
              month:'numeric',
              day:'numeric'
            }
          ).formatToParts(date);

          var result={};

          parts.forEach(function(part){
            if(
              part.type==='year'||
              part.type==='month'||
              part.type==='day'
            ){
              result[part.type]=part.value;
            }
          });

          if(result.year&&result.month&&result.day){
            return result.year+'年'+
              Number(result.month)+'月'+
              Number(result.day)+'日';
          }
        }catch(error){
          return date.getFullYear()+'年'+
            (date.getMonth()+1)+'月'+
            date.getDate()+'日';
        }

        return date.getFullYear()+'年'+
          (date.getMonth()+1)+'月'+
          date.getDate()+'日';
      }

      function normalize(row){
        var images=[];

        if(Array.isArray(row&&row.images)){
          images=images.concat(row.images);
        }else if(
          row &&
          typeof row.images==='string' &&
          row.images.trim().charAt(0)==='['
        ){
          try{
            images=images.concat(JSON.parse(row.images));
          }catch(error){}
        }

        if(row&&row.image){
          images.push(row.image);
        }

        if(row&&row.imageUrl){
          images.push(row.imageUrl);
        }

        for(var i=1;i<=6;i++){
          images.push(first(row,[
            'image'+i,
            '画像'+i,
            'photo'+i
          ]));
        }

        return {
          id:String(first(row,[
            'articleId',
            'id',
            '記事ID'
          ])||'').trim(),

          title:String(first(row,[
            'title',
            'articleTitle',
            '記事タイトル'
          ])||'活動報告').trim(),

          date:String(first(row,[
            'publishDate',
            'date',
            '公開日',
            'createdAt',
            '作成日'
          ])||'').trim(),

          body:String(first(row,[
            'body',
            'articleBody',
            '本文',
            '記事本文'
          ])||'').trim(),

          youtube:String(first(row,[
            'youtubeUrl',
            'youtubeURL',
            'YouTube',
            '動画URL',
            'videoUrl'
          ])||'').trim(),

          status:String(first(row,[
            'publicStatus',
            'status',
            '公開状態'
          ])||'').trim(),

          images:images
            .map(safeUrl)
            .filter(Boolean)
            .filter(function(value,index,array){
              return array.indexOf(value)===index;
            })
        };
      }

      function isVisible(article){
        var status=article.status.toLowerCase();

        return !status||
          (
            !status.includes('非公開')&&
            !status.includes('下書き')&&
            status!=='false'&&
            status!=='0'
          );
      }

      function dateNumber(value){
        var text=String(value||'').trim();

        var direct=text.match(
          /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/
        );

        if(direct){
          return new Date(
            Number(direct[1]),
            Number(direct[2])-1,
            Number(direct[3])
          ).getTime();
        }

        var date=new Date(text);

        return isNaN(date.getTime())
          ? 0
          : date.getTime();
      }

      function summary(value){
        var text=plainText(value);
        var paragraphs=text.split(/\n\s*\n/).filter(Boolean);
        var result=paragraphs.slice(0,2).join('\n\n');

        if(result.length>155){
          result=result.slice(0,155)+'…';
        }

        return result;
      }

      function articleLink(article){
        return 'article.html?id='+
          encodeURIComponent(article.id)+
          '&site='+
          encodeURIComponent(SITE_KEY);
      }

      function render(){
        var keyword=search.value.trim().toLowerCase();

        var filtered=articles.filter(function(article){
          if(!keyword){
            return true;
          }

          return (
            article.title+' '+plainText(article.body)
          ).toLowerCase().includes(keyword);
        });

        count.textContent=filtered.length+'件';
        list.innerHTML='';
        empty.classList.toggle('hidden',filtered.length!==0);

        filtered.forEach(function(article){
          var image=article.images[0]||youtubeImage(article.youtube);
          var body=summary(article.body);
          var card=document.createElement('article');

          card.className='article-card';

          card.innerHTML=
            (
              image
                ? '<img class="article-image"'+
                  ' src="'+escapeHtml(image)+'"'+
                  ' alt="'+escapeHtml(article.title)+'"'+
                  ' loading="lazy"'+
                  ' referrerpolicy="no-referrer">'
                : ''
            )+
            '<div class="article-content">'+
            '<p class="article-date">'+
            escapeHtml(formatDate(article.date)||'公開記事')+
            '</p>'+
            '<h2 class="article-title">'+
            escapeHtml(article.title)+
            '</h2>'+
            (
              body
                ? '<p class="article-summary">'+
                  escapeHtml(body)+
                  '</p>'
                : ''
            )+
            '<a class="read-link" href="'+
            escapeHtml(articleLink(article))+
            '">この記事を読む</a>'+
            '</div>';

          var imageElement=card.querySelector('img');

          if(imageElement){
            imageElement.addEventListener(
              'error',
              function(){
                imageElement.remove();
              },
              {once:true}
            );
          }

          list.appendChild(card);
        });
      }

      fetch(
        GAS_URL+
        '?action=publicArticles&siteKey='+
        encodeURIComponent(SITE_KEY)+
        '&_='+
        Date.now(),
        {
          cache:'no-store'
        }
      )
      .then(function(response){
        if(!response.ok){
          throw new Error('記事データを取得できません。');
        }

        return response.json();
      })
      .then(function(data){
        var rows=
          data&&Array.isArray(data.articles)
            ? data.articles
            : [];

        articles=rows
          .map(normalize)
          .filter(function(article){
            return article.id&&isVisible(article);
          });

        articles.sort(function(a,b){
          return dateNumber(b.date)-dateNumber(a.date);
        });

        loading.classList.add('hidden');
        render();
      })
      .catch(function(){
        loading.classList.add('hidden');

        errorBox.textContent=
          '活動報告を読み込めませんでした。時間をおいて再度お試しください。';

        errorBox.classList.remove('hidden');
      });

      search.addEventListener('input',render);
    })();
  </script>
</body>
</html>
